    setError('No rows to render.');
    return;
  }
  setIsLoading(true);

  const reportDiv = document.createElement('div');
  reportDiv.setAttribute('data-theme', 'light');
  reportDiv.style.cssText = 'position:absolute;top:-9999px;left:-9999px;background:white;padding:30px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1f2937;';

  const currentDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const headers = Object.keys(rows[0]);

  // Per-header colour for the summary-column category (mirrors on-screen tints)
const headerColor = (h) => {
  const k = h.toLowerCase();
  if (k === 'status')               return '';
  if (k === 'presents' || k === 'present') return '#047857';
  if (k === 'absents' || k === 'absent')   return '#b91c1c';
  if (k === 'leaves'  || k === 'leave')    return '#c2410c';
  if (k === 'total days' || k === 'days')  return '#1e40af';
    if (k === 'present hours' || k === 'total hours' || k === 'hours') return '#7e22ce';
  if (k === 'attendance %' || k === '%')   return '#1e40af';
  return '#374151';
};

  let html = `
    <div style="margin-bottom:24px;text-align:center;">
      <div style="display:inline-block;padding:6px 14px;background:#eff6ff;color:#1e40af;
                  font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
                  border-radius:999px;margin-bottom:10px;">
        ${title}
      </div>
      <div style="font-size:22px;font-weight:700;color:#111827;margin-bottom:4px;">
        ${title}
      </div>
      <div style="font-size:12px;color:#6b7280;">
        ${subtitle || ''} &nbsp;·&nbsp; Generated on ${currentDate}
      </div>
    </div>

    <table style="width:100%;border-collapse:separate;border-spacing:0;font-size:11px;color:#1f2937;">
      <thead>
        <tr style="background:#f8fafc;">
          ${headers.map((h, i) => `
            <th style="padding:10px 12px;text-align:${i < 3 ? 'left' : 'center'};
                       font-weight:600;font-size:11px;letter-spacing:0.02em;
                       color:${headerColor(h) || '#374151'};
                       border-bottom:2px solid #e5e7eb;
                       ${i === 0 ? 'border-top-left-radius:8px;' : ''}
                       ${i === headers.length - 1 ? 'border-top-right-radius:8px;' : ''}">
              ${h}
            </th>
          `).join('')}
        </tr>
      </thead>
      <tbody>
  `;

  rows.forEach((row, idx) => {
    const isTotal = row['Student Name'] === 'CLASS TOTAL';
    const isInactive = String(row.Status || '').toLowerCase() === 'inactive';
    const bg = isTotal ? '#eff6ff' : (idx % 2 === 0 ? '#ffffff' : '#fafbfc');
    const rowOpacity = (!isTotal && isInactive) ? '0.55' : '1';

    html += `<tr style="background:${bg};opacity:${rowOpacity};">`;
    headers.forEach((h, i) => {
      const raw = row[h] == null ? '' : String(row[h]);
      const isNum = /^-?\d+(\.\d+)?%?$/.test(raw) || /^\d/.test(raw);

      // Status column → badge
      if (h.toLowerCase() === 'status') {
        const st = raw.trim();
        let pillBg = '#f1f5f9', pillColor = '#64748b';
        if (st === 'Active')      { pillBg = '#ecfdf5'; pillColor = '#047857'; }
        else if (st === 'Inactive') { pillBg = '#f1f5f9'; pillColor = '#64748b'; }
        else if (st.startsWith('Present')) { pillBg = '#ecfdf5'; pillColor = '#047857'; }
        else if (st.startsWith('Absent'))  { pillBg = '#fef2f2'; pillColor = '#b91c1c'; }
        else if (st.startsWith('Leave'))   { pillBg = '#fff7ed'; pillColor = '#c2410c'; }
        else if (st === 'Not Marked') { pillBg = '#f1f5f9'; pillColor = '#94a3b8'; }
        html += `<td style="padding:8px 8px;text-align:center;border-bottom:1px solid #f1f5f9;">
                   <span style="display:inline-block;padding:3px 10px;border-radius:999px;
                                background:${pillBg};color:${pillColor};
                                font-size:10px;font-weight:600;letter-spacing:0.02em;">
                     ${st || '—'}
                   </span>
                 </td>`;
        return;
      }

      // Attendance % — colour by threshold
      if (h.toLowerCase() === 'attendance %') {
        const pct = parseFloat(raw) || 0;
        const pctColor = isTotal ? '#1e40af' : (pct >= 75 ? '#047857' : pct >= 50 ? '#c2410c' : '#b91c1c');
        const pctBg = isTotal ? '#eff6ff' : (pct >= 75 ? '#ecfdf5' : pct >= 50 ? '#fff7ed' : '#fef2f2');
        html += `<td style="padding:8px 8px;text-align:center;border-bottom:1px solid #f1f5f9;
                           background:${pctBg};color:${pctColor};font-weight:700;font-size:11px;">
                   ${raw || '0%'}
                 </td>`;
        return;
      }

      // Tinted summary columns
      const k = h.toLowerCase();
      let bgCell = 'transparent', fgCell = '#1f2937', weight = 500;
      if (k === 'presents' || k === 'present') { bgCell = '#ecfdf5'; fgCell = '#047857'; weight = 700; }
else if (k === 'absents' || k === 'absent') { bgCell = '#fef2f2'; fgCell = '#b91c1c'; weight = 700; }
else if (k === 'leaves' || k === 'leave')  { bgCell = '#fff7ed'; fgCell = '#c2410c'; weight = 700; }
else if (k === 'total days' || k === 'days') { bgCell = '#eff6ff'; fgCell = '#1e40af'; weight = 700; }
else if (k === 'present hours' || k === 'total hours' || k === 'hours') { bgCell = '#faf5ff'; fgCell = '#7e22ce'; weight = 700; }

      // First column: monospaced if numeric (Std ID), semibold if Name
      let extra = '';
      if (i === 0 && isNum) {
        extra = 'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#334155;font-size:11px;';
      } else if (i === 0) {
        extra = 'font-weight:600;color:#0f172a;';
      } else if (isTotal) {
        extra = 'font-weight:700;color:#1e40af;';
      }

      html += `<td style="padding:8px ${i < 3 ? '12px' : '8px'};
                         text-align:${i < 3 ? 'left' : 'center'};
                         border-bottom:1px solid #f1f5f9;
                         background:${bgCell};color:${isTotal ? '#1e40af' : fgCell};
                         font-weight:${isTotal ? 700 : weight};font-size:11px;${extra}">
                 ${raw || '—'}
               </td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  html += REPORT_CAVEAT_HTML;

  reportDiv.innerHTML = html;
  document.body.appendChild(reportDiv);
  await new Promise(r => setTimeout(r, 100));

  try {
    const canvas = await html2canvas(reportDiv, {
      scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false
    });
    document.body.removeChild(reportDiv);
    const link = document.createElement('a');
    link.download = `${filename}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    setSuccessMessage('PNG report downloaded!');
  } catch (err) {
    document.body.removeChild(reportDiv);
    setError('Failed to generate PNG: ' + err.message);
  }
  setIsLoading(false);
};



  const logDownload = (name, format) => {
    setDownloadHistory(prev => [{ name, format, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }, ...prev].slice(0, 5));
  };

  const generateDaily = (e) => {
  e.preventDefault();
  if (!dailyDate || !dailyClass || !dailySection) {
    setError('Please select date, class and section.');
    return;
  }
  if (reportTerm) {
    if (!dailyTermRange) {
      setError('No term dates set up for ' + dailyClass + '-' + dailySection + ' in Term ' + reportTerm + '. Add a Class_Terms row first.');
      return;
    }
    if (dailyDate < dailyTermRange.start || dailyDate > dailyTermRange.end) {
      setError('Selected date is outside Term ' + reportTerm + ' for ' + dailyClass + '-' + dailySection + ' (' + dailyTermRange.start + ' to ' + dailyTermRange.end + ').');
      return;
    }
  }

  // ---- Population: Student_Data, filtered by class/section + day eligibility ----
  const dailyRoster = (data.student_data || []).filter(s =>
    String(s.Student_Class || '').trim() === String(dailyClass).trim() &&
    String(s.Student_Section || '').trim() === String(dailySection).trim() &&
    isEnrolledOn(dailyDate, s.Date_of_Joining, s.Inactive_Date)
  );

  if (dailyRoster.length === 0) {
    setError(`No students enrolled in ${dailyClass}-${dailySection} on ${dailyDate}.`);
    return;
  }

  // ---- Attendance lookup: Std_ID → Status for that date only ----
  // Multiple markings on the same day: count them and render as P2 / A2 / L2
  const perStudent = {}; // { '2635': { present: 2, absent: 0, leave: 0, other: 0 } }
  (data.student_attendance || []).forEach(a => {
    if (String(a.Student_Class || '').trim() !== String(dailyClass).trim()) return;
    if (String(a.Student_Section || '').trim() !== String(dailySection).trim()) return;
    if (toYMD(a.Date) !== dailyDate) return;

    const sid = String(a.Std_ID || '').trim();
    if (!sid) return;
    if (!perStudent[sid]) perStudent[sid] = { present: 0, absent: 0, leave: 0, other: 0 };
    const st = String(a.Status || '').toLowerCase().trim();
    if (st === 'present')      perStudent[sid].present++;
    else if (st === 'absent')  perStudent[sid].absent++;
    else if (st === 'leave')   perStudent[sid].leave++;
    else                       perStudent[sid].other++;
  });

  const statusFor = (sid) => {
    const c = perStudent[sid];
    if (!c) return 'Not Marked';
    if (c.present > 0) return 'Present' + (c.present > 1 ? ` (${c.present})` : '');
    if (c.absent  > 0) return 'Absent'  + (c.absent  > 1 ? ` (${c.absent})`  : '');
    if (c.leave   > 0) return 'Leave'   + (c.leave   > 1 ? ` (${c.leave})`   : '');
    if (c.other   > 0) return 'Other'   + (c.other   > 1 ? ` (${c.other})`   : '');
    return 'Not Marked';
  };

  // ---- Build rows: full roster, one row per student ----
  let rows = dailyRoster.map(s => ({
    'Student Name': s.Student_Name || '',
    'Student ID':   s.Std_ID || '',
    'Class':        s.Student_Class || '',
    'Section':      s.Student_Section || '',
    'Date':         dailyDate,
    'Status':       statusFor(String(s.Std_ID || '').trim()),
  }));

  const cleanName = (s) => String(s || '').replace(/[\u00A0\u200B-\u200D\uFEFF]/g, '').trim();
  rows.sort((a, b) => cleanName(a['Student Name']).localeCompare(cleanName(b['Student Name']), undefined, { sensitivity: 'base' }));

  const filename = `attendance_${dailyClass}_${dailySection}_${dailyDate}`;

  if (dailyFormat === 'csv') {
    downloadCSVReport(rows, `${filename}.csv`);
    setSuccessMessage(`CSV downloaded — ${rows.length} student(s).`);
  } else {
    renderAsPNG(
      rows,
      filename,
      'Daily Attendance Report',
      `Class ${dailyClass} · Section ${dailySection} · ${dailyDate}`
    );
  }

  logDownload(`Attendance - ${dailyClass}-${dailySection} - ${dailyDate}`, dailyFormat.toUpperCase());
};

  const generateMonthly = (e) => {
  e.preventDefault();
  if (!monthlyClass || !monthlySection || !monthlyMonth) {
    setError('Please fill all fields.');
    return;
  }
  if (reportTerm) {
    if (!monthlyTermRange) {
      setError('No term dates set up for ' + monthlyClass + '-' + monthlySection + ' in Term ' + reportTerm + '. Add a Class_Terms row first.');
      return;
    }
    const [my, mm] = monthlyMonth.split('-').map(Number);
    const ms = new Date(my, mm - 1, 1);
    const me = new Date(my, mm, 0);
    if (me < termParseDate_(monthlyTermRange.start) || ms > termParseDate_(monthlyTermRange.end)) {
      setError('Selected month is outside Term ' + reportTerm + ' for ' + monthlyClass + '-' + monthlySection + ' (' + monthlyTermRange.start + ' to ' + monthlyTermRange.end + ').');
      return;
    }
  }

  const [year, month] = monthlyMonth.split('-').map(Number);
  const monthName = new Date(year, month - 1).toLocaleString('default', { month: 'long' });
  const monthStart = new Date(year, month - 1, 1, 0, 0, 0, 0);
  const monthEnd   = new Date(year, month, 0, 23, 59, 59, 999);

  // ---- Population: Student_Data, filtered by class/section + month eligibility ----
  const monthlyRoster = (data.student_data || []).filter(s => {
    if (String(s.Student_Class || '').trim() !== String(monthlyClass).trim()) return false;
    if (String(s.Student_Section || '').trim() !== String(monthlySection).trim()) return false;
    return isEnrolledInMonth(monthStart, monthEnd, s.Date_of_Joining, s.Inactive_Date);
  });

  if (monthlyRoster.length === 0) {
    setError(`No students enrolled in ${monthlyClass}-${monthlySection} during ${monthName} ${year}.`);
    return;
  }

  // ---- Pre-aggregate attendance once (O(n)), not per student (O(n×m)) ----
  const aggByStdId = {}; // { '2635': { presents, absents, leaves, totalDays, totalHours } }
  (data.student_attendance || []).forEach(r => {
    if (String(r.Student_Class || '').trim() !== String(monthlyClass).trim()) return;
    if (String(r.Student_Section || '').trim() !== String(monthlySection).trim()) return;
    const dt = parseAnyDate(r.Date);
    if (!dt || dt.getFullYear() !== year || (dt.getMonth() + 1) !== month) return;
    // Term filter (v4): only count days inside this class-section's term range.
    if (monthlyTermRange) {
      const k = termDateKey_(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()));
      if (k < monthlyTermRange.start || k > monthlyTermRange.end) return;
    }

    const sid = String(r.Std_ID || '').trim();
    if (!sid) return;
    if (!aggByStdId[sid]) aggByStdId[sid] = { presents: 0, absents: 0, leaves: 0, totalDays: 0, totalHours: 0 };

    const st = String(r.Status || '').toLowerCase().trim();
    if (st === 'present') {
      aggByStdId[sid].presents++;
      aggByStdId[sid].totalDays++;
      // Only Present earns hours — matches MonthlyBarReport's Option A rule.
      // Absent/Leave rows skip hours even if Hours is populated.
      const hrs = Number(r.Hours || 0);
      if (!isNaN(hrs) && hrs > 0) {
        aggByStdId[sid].totalHours += hrs;
      }
    }
    else if (st === 'absent')  { aggByStdId[sid].absents++;  aggByStdId[sid].totalDays++; }
    else if (st === 'leave')   { aggByStdId[sid].leaves++;   aggByStdId[sid].totalDays++; }
  });

  // ---- Month-relative status per student (Active / Inactive in that month) ----
  const monthStatusFor = (s) => {
    const doj      = parseAnyDate(s.Date_of_Joining);
    const inactive = parseAnyDate(s.Inactive_Date);
    const joinedByMonthEnd   = !doj      || doj <= monthEnd;
    const notLeftBeforeStart = !inactive || inactive >= monthStart;
    return (joinedByMonthEnd && notLeftBeforeStart) ? 'Active' : 'Inactive';
  };

  // ---- Single-student branch ----
  if (reportType === 'single') {
    if (!monthlyStudentId) { setError('Please select a student.'); return; }
    const student = monthlyRoster.find(s => String(s.Std_ID) === String(monthlyStudentId));
    if (!student) {
      setError('That student was not enrolled in this class/section during the selected month.');
      return;
    }
    const agg = aggByStdId[String(student.Std_ID).trim()] || { presents: 0, absents: 0, leaves: 0, totalDays: 0, totalHours: 0 };
    const pct = agg.totalDays > 0 ? Math.round((agg.presents / agg.totalDays) * 10000) / 100 : 0;

    const rows = [{
      'Student Name':  student.Student_Name || '',
      'Student ID':    student.Std_ID || '',
      'Class Section': `${monthlyClass}-${monthlySection}`,
      'Month':         monthName,
      'Year':          year,
      'Presents':      agg.presents,
      'Absents':       agg.absents,
      'Leaves':        agg.leaves,
      'Total Days':    agg.totalDays,
      'Present Hours': Math.round((agg.totalHours || 0) * 100) / 100,
      'Attendance %':  `${pct}%`,
      'Status':        monthStatusFor(student),
    }];

    const filename = `${(student.Student_Name || 'student').replace(/\s+/g, '_')}_${monthlyClass}_${monthlySection}_${monthName}_${year}`;

    if (monthlyFormat === 'csv') {
      downloadCSVReport(rows, `student_summary_${filename}.csv`);
      setSuccessMessage('CSV report downloaded!');
    } else {
      renderAsPNG(
        rows,
        `student_summary_${filename}`,
        'Student Monthly Summary',
        `${student.Student_Name || student.Std_ID} · ${monthlyClass}-${monthlySection} · ${monthName} ${year}`
      );
    }
    logDownload(`Student Summary - ${student.Student_Name || monthlyStudentId} - ${monthName} ${year}`, monthlyFormat.toUpperCase());
    return;
  }

  // ---- All-students-in-class branch ----
  const rows = monthlyRoster.map(s => {
    const agg = aggByStdId[String(s.Std_ID).trim()] || { presents: 0, absents: 0, leaves: 0, totalDays: 0, totalHours: 0 };
    const pct = agg.totalDays > 0 ? Math.round((agg.presents / agg.totalDays) * 10000) / 100 : 0;
    return {
      'Student Name':  s.Student_Name || '',
      'Student ID':    s.Std_ID || '',
      'Class Section': `${monthlyClass}-${monthlySection}`,
      'Month':         monthName,
      'Year':          year,
      'Presents':      agg.presents,
      'Absents':       agg.absents,
      'Leaves':        agg.leaves,
      'Total Days':    agg.totalDays,
      'Present Hours': Math.round((agg.totalHours || 0) * 100) / 100,
      'Attendance %':  `${pct}%`,
      'Status':        monthStatusFor(s),
    };
  });


      // Sort alphabetically by student name before adding the total row
  const cleanName = (s) => String(s || '').replace(/[\u00A0\u200B-\u200D\uFEFF]/g, '').trim();
  rows.sort((a, b) =>
    cleanName(a['Student Name']).localeCompare(cleanName(b['Student Name']), undefined, { sensitivity: 'base' })
  );


  // Class-total row
  const totalPresents = rows.reduce((sum, r) => sum + Number(r.Presents        || 0), 0);
  const totalAbsents  = rows.reduce((sum, r) => sum + Number(r.Absents         || 0), 0);
  const totalLeaves   = rows.reduce((sum, r) => sum + Number(r.Leaves          || 0), 0);
  const totalDays     = rows.reduce((sum, r) => sum + Number(r['Total Days']   || 0), 0);
  const totalHours    = rows.reduce((sum, r) => sum + Number(r['Present Hours'] || 0), 0);
  rows.push({
    'Student Name': 'CLASS TOTAL',
    'Student ID':   '',
    'Class Section': `${monthlyClass}-${monthlySection}`,
    'Month':         monthName,
    'Year':          year,
    'Presents':      totalPresents,
    'Absents':       totalAbsents,
    'Leaves':        totalLeaves,
    'Total Days':    totalDays,
    'Present Hours': Math.round(totalHours * 100) / 100,
    'Attendance %':  totalDays > 0 ? `${Math.round((totalPresents / totalDays) * 10000) / 100}%` : '0%',
    'Status':        '',
  });

  const filename = `class_summary_${monthlyClass}_${monthlySection}_${monthName}_${year}`;

  if (monthlyFormat === 'csv') {
    downloadCSVReport(rows, `${filename}.csv`);
    setSuccessMessage('CSV report downloaded!');
  } else {
    renderAsPNG(
      rows,
      filename,
      'Class Monthly Summary',
      `Class ${monthlyClass} · Section ${monthlySection} · ${monthName} ${year}`
    );
  }
  logDownload(`Class Summary - ${monthlyClass}-${monthlySection} - ${monthName} ${year}`, monthlyFormat.toUpperCase());
};

                <select className="form-input" id="monthlyStudent" value={monthlyStudentId} onChange={e => { setMonthlyStudentId(e.target.value); setMonthlyMonth(''); }} required disabled={!monthlySection}>

              <select className="form-input" id="monthlyMonth" value={monthlyMonth} onChange={e => setMonthlyMonth(e.target.value)} required>
                <option value="" disabled>Select Month</option>
                {availableMonths.map(m => <option key={m.key} value={m.key}>{m.display}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label htmlFor="monthlyFormat">Format</label>

            </div>
            <button type="submit" disabled={isLoading} className={`btn-primary w-full ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}>
              <i className="uil uil-download"></i> Download Summary

          </form>
        </div>
      </div>

      <div className="form-container mt-6">
        <h3 className="text-lg font-semibold mb-3">Recent Downloads</h3>
        {downloadHistory.length === 0 ? (
          <p className="text-gray-500 text-center">No recent downloads</p>
        ) : (
          downloadHistory.map((h, i) => (
            <div key={i} className="flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700 last:border-0">
              <span><i className={`uil ${h.format === 'PNG' ? 'uil-image-v' : 'uil-file'} mr-2`}></i>{h.name}</span>
              <span className="text-sm text-gray-500">{h.time}</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

// ---------- Shared helpers for the ITREB report (v7.1) ----------
// Per-student ACCESS marking computation, extracted verbatim from
// AccessHoursReport.buildReportRows (same window, same hours, same
// thresholds). ITREB aggregates its results by base class + gender.
// AccessHoursReport keeps its own inline copy (byte-identical), so this
// helper mirrors it — if the ACCESS thresholds ever change, change both.
// Returns [{ baseClass, section, gender, marking, actualHours }] for students
// enrolled in the period. actualHours is the student's earned hours in the
// period (Present rows only, inside the enrolled window). The marking/window
// logic is unchanged from AccessHoursReport.buildReportRows.
function computeAccessStudentMarkings_(students, attRows, classTerms, selectedTerm, months, endKey) {
  const norm = (v) => (v === undefined || v === null) ? '' : String(v).trim();
  const monthKeyOf = (y, m) => y + '-' + String(m).padStart(2, '0');
  const monthStartDate = (key) => { const p = String(key).split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1); };
  const monthEndDate = (key) => { const p = String(key).split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0); };
  const monthsInRange = (startKey, endKey) => {
    const out = [];
    const sp = String(startKey || '').split('-');
    let y = parseInt(sp[0], 10), m = parseInt(sp[1], 10);
    const ep = String(endKey || '').split('-');
    const ey = parseInt(ep[0], 10), em = parseInt(ep[1], 10);
    if (!y || !m || !ey || !em) return out;
    while (y < ey || (y === ey && m <= em)) {
      out.push(monthKeyOf(y, m));
      m += 1; if (m > 12) { m = 1; y += 1; }
    }
    return out;
  };

  const studentById = {};
  (students || []).forEach(s => { studentById[norm(s.Std_ID)] = s; });

  // Attendance rows, REC-scoped by Std_ID and by the student's school
  // (v7.20 O3 — same second-layer check as buildReportRows).
  const attByStudent = {};
  (attRows || []).forEach(a => {
    const sid = norm(a.Std_ID);
    if (!studentById[sid]) return;
    const rowRec = norm(a.REC_ID);
    const stuRec = norm(studentById[sid].REC_ID);
    if (rowRec && stuRec && rowRec !== stuRec) return;
    const dt = parseAnyDate(a.Date);
    if (!dt) return;
    if (!attByStudent[sid]) attByStudent[sid] = [];
    attByStudent[sid].push({ status: String(a.Status || '').toLowerCase().trim(), hours: Number(a.Hours || 0), date: new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), event: norm(a.Event_Name) });
  });

  const endMonthEnd = monthEndDate(endKey);
  const out = [];
  (students || []).forEach(st => {
    const cls = norm(st.Student_Class);
    const sec = norm(st.Student_Section);
    const cs = cls + '-' + sec;
    // Class-level span is the fallback; section-level range decides the window.
    const span = termSpanForClass_(classTerms || [], cls, selectedTerm);
    const range = termRangeForClass_(classTerms || [], cs, selectedTerm) || span;
    const doj = parseAnyDate(st.Date_of_Joining);
    const inactive = parseAnyDate(st.Inactive_Date);
    let winStart = range ? termParseDate_(range.start) : monthStartDate(months[0]);
    if (doj) {
      const dj = new Date(doj.getFullYear(), doj.getMonth(), doj.getDate());
      if (dj > winStart) winStart = dj;
    }
    let winEnd = new Date(endMonthEnd.getFullYear(), endMonthEnd.getMonth(), endMonthEnd.getDate());
    if (inactive) {
      const ia = new Date(inactive.getFullYear(), inactive.getMonth(), inactive.getDate());
      if (ia < winEnd) winEnd = ia;
    }
    // Cap at the student's own class-section term end.
    if (range) {
      const re = termParseDate_(range.end);
      if (re && re < winEnd) winEnd = re;
    }
    const winStartKey = monthKeyOf(winStart.getFullYear(), winStart.getMonth() + 1);
    const winEndKey = monthKeyOf(winEnd.getFullYear(), winEnd.getMonth() + 1);
    const winMonths = monthsInRange(winStartKey, winEndKey).filter(k => months.indexOf(k) !== -1);
    if (!winMonths.length) return; // joined after the period, or left before it started
    const m = winMonths.length;
    const recs = attByStudent[norm(st.Std_ID)] || [];
    let actualHours = 0;
    let normalHours = 0;
    let episodicHours = 0;
    months.forEach(mk => {
      if (winMonths.indexOf(mk) === -1) return;
      const ms = monthStartDate(mk), me = monthEndDate(mk);
      const lo = ms > winStart ? ms : winStart;
      const hi = me < winEnd ? me : winEnd;
      const loStr = termDateKey_(lo), hiStr = termDateKey_(hi);
      recs.forEach(r => {
        const k = termDateKey_(r.date);
        if (k < loStr || k > hiStr) return;
        // Only Present earns hours — matches the ACCESS report's rule.
        // Split by event: a blank Event_Name is a normal day; a named event is episodic.
        if (r.status === 'present') {
          const h = isNaN(r.hours) ? 0 : r.hours;
          actualHours += h;
          if (r.event) episodicHours += h; else normalHours += h;
        }
      });
    });
    actualHours = Math.round(actualHours * 100) / 100;
    normalHours = Math.round(normalHours * 100) / 100;
    episodicHours = Math.round(episodicHours * 100) / 100;
    let marking;
    if (actualHours === 0) marking = 'P0';
    else if (actualHours >= 6.25 * m) marking = 'P3';
    else if (actualHours >= 2.5 * m) marking = 'P2';
    else marking = 'P1';
    out.push({ baseClass: cls, section: sec ? cs : cls, gender: norm(st.Gender), marking: marking, actualHours: actualHours, normalHours: normalHours, episodicHours: episodicHours });
  });
  return out;
}

// Working Days + Average Hour per base class from Daily_Hours_Setup.
// Working Days = distinct dates in the period with a setup row AND
// attendance marked that day (any Student_Attendance row for that date
// and any section of the base class). Setup rows are deduped with the
// Daily Hours Report's key (Date + Class_Section + Category + Type +
// Hours + Teacher_ID). Average Hour = the MEAN of Hours across the
// deduped setup rows on the marked dates only (sum / count — e.g.
// 1.25, 1.5, 2 -> 1.58). Rounded Average Hour = that mean rounded to
// the nearest standard session length (ITREB_STANDARD_HOURS) — e.g. a
// mean of 1.89 shows as 2. Neither is an average of the actual (earned)
// hours; those are summed separately as Actual Hours.
// EPISODIC setup rows are EXCLUDED from the mean (a 10-hour Trip would
// distort it); 'normal' and 'both' rows count. Episodic days still
// count as Working Days — only the mean excludes them.
// Returns { [key]: { workingDays, avgHours, roundedAvgHours, setupHours, setupCount } }
// where key is the base class,
// or the class-section when bySection is true. A class/section with setup
// rows in the period but no marked date still appears (0 days, 0 hours).
// The school's standard session lengths (hours). Average Hour is shown as
// the nearest of these — e.g. a mean of 1.89 shows as 2. This list is the
// single place to change them.
const ITREB_STANDARD_HOURS = [1, 1.25, 1.5, 2, 2.5, 3];
// Round a computed mean to the nearest standard session length, using the
// UNROUNDED mean for the distance comparison. An exact tie rounds UP to the
// higher value; below 1 rounds to 1, above 3 rounds to 3. (Zero setup rows
// is handled by the caller, which leaves 0 as 0.)
function roundToStandardHour_(mean) {
  if (mean == null || isNaN(mean) || mean <= 0) return 0;
  var best = ITREB_STANDARD_HOURS[0];
  for (var i = 1; i < ITREB_STANDARD_HOURS.length; i++) {
    if (Math.abs(mean - ITREB_STANDARD_HOURS[i]) <= Math.abs(mean - best)) best = ITREB_STANDARD_HOURS[i];
  }
  return best;
}

function computeItrebSetupStats_(setupRows, attRows, classTerms, selectedTerm, months, bySection) {
  const normText = (v) => String(v == null ? '' : v).trim();
  // Dates arrive in two shapes: setup rows via getSheetData are 'yyyy-MM-dd',
  // attendance rows via getStudentAttendance are 'yyyy-MMM-dd' — accept both.
  const normDate = (v) => {
    const s = String(v == null ? '' : v).trim();
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    const k = dayKey(v);
    return /^\d{4}-\d{2}-\d{2}$/.test(k) ? k : '';
  };
  // Attendance dates per key (base class, or class-section when bySection is
  // true — any status, any event).
  const attDatesByBase = {};
  // v7.20 (O3): a marked date only counts if it comes from one of the
  // setup rows' schools — another school's marking on the same date
  // must not make a setup day a working day here. (No REC_ID anywhere
  // fails open.)
  const itrebRecs = {};
  (setupRows || []).forEach(r => { const sr = normText(r.REC_ID); if (sr) itrebRecs[sr] = true; });
  (attRows || []).forEach(a => {
    const d = normDate(a.Date);
    if (!d) return;
    const aRec = normText(a.REC_ID);
    if (aRec && Object.keys(itrebRecs).length && !itrebRecs[aRec]) return;
    let cs = normText(a.Class_Section);
    if (!cs) {
      const c = normText(a.Student_Class), s = normText(a.Student_Section);
      if (!c) return;
      cs = s ? c + '-' + s : c;
    }
    const b = bySection ? cs : termBaseClassOf_(cs);
    if (!b) return;
    if (!attDatesByBase[b]) attDatesByBase[b] = {};
    attDatesByBase[b][d] = true;
  });
  // Per-class-section term range, cached (first matching ACTIVE row wins).
  const rangeCache = {};
  const rangeFor = (cs) => {
    const key = String(cs || '').trim().toLowerCase();
    if (!(key in rangeCache)) rangeCache[key] = termRangeForClass_(classTerms || [], cs, selectedTerm);
    return rangeCache[key];
  };
  const seen = {};
  const byBase = {};
  (setupRows || []).forEach(r => {
    const date = normDate(r.Date);
    const cs = normText(r.Class_Section);
    if (!date || !cs) return;
    if (months.indexOf(date.slice(0, 7)) === -1) return; // outside the period months
    const range = rangeFor(cs);
    if (!range) return; // class-section has no term dates for this term
    if (date < range.start || date > range.end) return;
    // The sheet's type column is Attendance_Type; fall back to the older 'Type' column.
    const typeRaw = normText(r.Attendance_Type) || normText(r.Type) || 'normal';
    const type = typeRaw.toLowerCase() === 'episodic' ? 'Episodic' : 'Normal';
    const category = normText(r.Category);
    const hours = Number(r.Hours || 0);
    const teacher = normText(r.Teacher_ID);
    const dupKey = [date, cs.toLowerCase(), category.toLowerCase(), type, hours, teacher.toLowerCase()].join('|');
    if (seen[dupKey]) return; // duplicate setup row counts once
    seen[dupKey] = true;
    const b = bySection ? cs : termBaseClassOf_(cs);
    if (!b) return;
    if (!byBase[b]) byBase[b] = { dates: {}, hours: 0, count: 0 };
    const markedDates = attDatesByBase[b] || {};
    if (markedDates[date]) {
      byBase[b].dates[date] = true;
      // Episodic setup hours are excluded from the mean (they distort it);
      // the day still counts as a Working Day. 'normal' and 'both' count.
      if (type !== 'Episodic') {
        byBase[b].hours += hours;
        byBase[b].count += 1;
      }
    }
  });
  const out = {};
  Object.keys(byBase).forEach(b => {
    const n = byBase[b].count;
    out[b] = { workingDays: Object.keys(byBase[b].dates).length, avgHours: n ? Math.round((byBase[b].hours / n) * 100) / 100 : 0, roundedAvgHours: n ? roundToStandardHour_(byBase[b].hours / n) : 0, setupHours: Math.round(byBase[b].hours * 100) / 100, setupCount: n };
  });
  return out;
}

// Gender bucket for the ITREB Boys/Girls split: 'B', 'G', or '' (unknown -> Total only).
function itrebGenderBucket_(g) {
  const v = String(g == null ? '' : g).trim().toLowerCase();
  if (v === 'male' || v === 'm' || v === 'boy' || v === 'boys') return 'B';
  if (v === 'female' || v === 'f' || v === 'girl' || v === 'girls') return 'G';
  return '';
}

    function ItrebReport({ data, isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, classes, classSectionMap, searchQuery, username }) {
      const [selectedTerm, setSelectedTerm] = useState('');
      const [periodType, setPeriodType] = useState('monthly');
      const [selectedMonth, setSelectedMonth] = useState('');
      const [selectedYear, setSelectedYear] = useState('');
      const [selectedQuarter, setSelectedQuarter] = useState('Q1');
      const [breakdown, setBreakdown] = useState('class');
      const [reportRows, setReportRows] = useState([]);
      const [reportMeta, setReportMeta] = useState(null);
      const [generated, setGenerated] = useState(false);

      const norm = (v) => (v === undefined || v === null) ? '' : String(v).trim();
      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      // Quarter ends reuse the ACCESS report's definition exactly.
      const ITREB_QUARTERS = { Q1: { month: 11, yearOff: 0 }, Q2: { month: 2, yearOff: 1 }, Q3: { month: 5, yearOff: 1 }, Q4: { month: 8, yearOff: 1 } };
      // 16 classes, NO XII (HRE is the last class).
      const ITREB_CLASS_ORDER = ['IBT', 'NUR', 'KGI', 'KGII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'HRE'];
      const termOptions = termPickerOptions_(data.terms || []).filter(t => termIsActive_(t.Is_Active));

      const monthKeyOf = (y, m) => y + '-' + String(m).padStart(2, '0');
      const monthLabelShort = (key) => {
        const parts = String(key || '').split('-');
        const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
        if (!y || !m) return String(key || '');
        return MONTH_SHORT[m - 1] + ' ' + String(y).slice(2);
      };
      const monthLabelLong = (key) => {
        const parts = String(key || '').split('-');
        const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
        if (!y || !m) return String(key || '');
        return MONTH_NAMES[m - 1] + ' ' + y;
      };
      const monthsInRange = (startKey, endKey) => {
        const out = [];
        const sp = String(startKey || '').split('-');
        let y = parseInt(sp[0], 10), m = parseInt(sp[1], 10);
        const ep = String(endKey || '').split('-');
        const ey = parseInt(ep[0], 10), em = parseInt(ep[1], 10);
        if (!y || !m || !ey || !em) return out;
        while (y < ey || (y === ey && m <= em)) {
          out.push(monthKeyOf(y, m));
          m += 1; if (m > 12) { m = 1; y += 1; }
        }
        return out;
      };
      const monthEndDate = (key) => { const p = String(key).split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0); };

      // ACTIVE Class_Terms rows of the picked term (data.class_terms is already REC-filtered).
      const activeTermRows = selectedTerm
        ? (data.class_terms || []).filter(r => termIsActive_(r.Is_Active) && norm(r.Term_ID).toLowerCase() === norm(selectedTerm).toLowerCase())
        : [];
      const termStartYear = () => {
        const found = String(selectedTerm || '').match(/(\d{4})/);
        if (found) return parseInt(found[1], 10);
        const starts = activeTermRows.map(r => termParseDate_(r.Start_Date)).filter(Boolean);
        if (starts.length) return Math.min.apply(null, starts.map(d => d.getFullYear()));
        return new Date().getFullYear();
      };
      const periodEndKey = () => {
        if (periodType === 'monthly') return (selectedYear && selectedMonth) ? selectedYear + '-' + selectedMonth : '';
        const sy = termStartYear();
        if (periodType === 'quarterly') {
          const q = ITREB_QUARTERS[selectedQuarter] || ITREB_QUARTERS.Q1;
          return monthKeyOf(sy + q.yearOff, q.month);
        }
        // Yearly: latest End_Date among the term's Class_Terms rows (fallback Aug of start year + 1).
        const ends = activeTermRows.map(r => termParseDate_(r.End_Date)).filter(Boolean);
        if (ends.length) {
          const mx = new Date(Math.max.apply(null, ends.map(d => d.getTime())));
          return monthKeyOf(mx.getFullYear(), mx.getMonth() + 1);
        }
        return monthKeyOf(sy + 1, 8);
      };
      const reportStartKey = () => {
        const starts = activeTermRows.map(r => termParseDate_(r.Start_Date)).filter(Boolean);
        if (!starts.length) return '';
        const mn = new Date(Math.min.apply(null, starts.map(d => d.getTime())));
        return monthKeyOf(mn.getFullYear(), mn.getMonth() + 1);
      };
      const termSpan = selectedTerm ? termSpan_(data.class_terms || [], selectedTerm) : null;
      const termYears = (() => {
        if (!termSpan) return [];
        const sY = parseInt(String(termSpan.start).slice(0, 4), 10);
        const eY = parseInt(String(termSpan.end).slice(0, 4), 10);
        if (!sY || !eY) return [];
        const out = [];
        for (let y = sY; y <= eY; y++) out.push(y);
        return out;
      })();
      const quarterOptions = ['Q1', 'Q2', 'Q3', 'Q4'].map(q => {
        const def = ITREB_QUARTERS[q];
        return { value: q, label: q + ' — ends ' + MONTH_NAMES[def.month - 1] + ' ' + (termStartYear() + def.yearOff) };
      });
      const periodLabel = () => {
        if (!reportMeta) return '';
        if (periodType === 'monthly') return monthLabelLong(reportMeta.endKey);
        if (periodType === 'quarterly') return selectedQuarter + ' (QTD) — ' + monthLabelShort(reportMeta.startKey) + ' to ' + monthLabelLong(reportMeta.endKey);
        return 'Full year — ' + monthLabelShort(reportMeta.startKey) + ' to ' + monthLabelLong(reportMeta.endKey);
      };
      const resetResults = () => { setReportRows([]); setReportMeta(null); setGenerated(false); };
      const clearForm = () => { setSelectedTerm(''); setPeriodType('monthly'); setSelectedMonth(''); setSelectedYear(''); setSelectedQuarter('Q1'); setBreakdown('class'); resetResults(); };

      const generateReport = async (e) => {
        if (e) e.preventDefault();
        // Term is mandatory (Daily Hours v6.7 pattern): no auto-default — the picker starts empty.
        if (!selectedTerm) { setError('Please select a Term.'); return; }
        if (periodType === 'monthly' && (!selectedMonth || !selectedYear)) { setError('Please select a Month and Year.'); return; }
        const endKey = periodEndKey();
        const startKey = reportStartKey();
        if (!startKey) { setError('No term dates set up for Term ' + selectedTerm + '. Add Class_Terms rows first.'); return; }
        if (!endKey || endKey < startKey) { setError('The period ends before the term starts.'); return; }
        setIsLoading(true);
        setError('');
        try {
          const recId = userPermissions?.REC_ID || '';
          const startDate = startKey + '-01';
          const endDate = termDateKey_(monthEndDate(endKey));
          const [attRows, setupRows] = await Promise.all([
            callWithRetry('getStudentAttendance', { startDate, endDate, statusFilter: 'All', username }),
            callWithRetry('getSheetData', 'Daily_Hours_Setup', recId)
          ]);
          const months = monthsInRange(startKey, endKey);
          // P0–P3: same ACCESS hours bands, same per-student computation.
          const markings = computeAccessStudentMarkings_((data.student_data || []), attRows || [], data.class_terms || [], selectedTerm, months, endKey);
          const setupStats = computeItrebSetupStats_(setupRows || [], attRows || [], data.class_terms || [], selectedTerm, months, breakdown === 'section');
          const emptyCounts = () => ({ actualHours: 0, normalHours: 0, episodicHours: 0, enrolled: { B: 0, G: 0, T: 0 }, P0: { B: 0, G: 0, T: 0 }, P1: { B: 0, G: 0, T: 0 }, P2: { B: 0, G: 0, T: 0 }, P3: { B: 0, G: 0, T: 0 } });
          const byClass = {};
          markings.forEach(s => {
            const key = breakdown === 'section' ? s.section : s.baseClass;
            if (!byClass[key]) byClass[key] = emptyCounts();
            const b = byClass[key];
            const g = itrebGenderBucket_(s.gender);
            b.actualHours = Math.round((b.actualHours + (s.actualHours || 0)) * 100) / 100;
            b.normalHours = Math.round((b.normalHours + (s.normalHours || 0)) * 100) / 100;
            b.episodicHours = Math.round((b.episodicHours + (s.episodicHours || 0)) * 100) / 100;
            b.enrolled.T += 1; if (g) b.enrolled[g] += 1;
            b[s.marking].T += 1; if (g) b[s.marking][g] += 1;
          });
          Object.keys(setupStats).forEach(c => { if (!byClass[c]) byClass[c] = emptyCounts(); });
          const ordered = breakdown === 'section'
            ? Object.keys(byClass).sort((a, b) => {
                const baseOf = (k) => termBaseClassOf_(k) || k;
                const ai = ITREB_CLASS_ORDER.indexOf(baseOf(a)), bi = ITREB_CLASS_ORDER.indexOf(baseOf(b));
                const ao = ai === -1 ? 999 : ai, bo = bi === -1 ? 999 : bi;
                if (ao !== bo) return ao - bo;
                return a < b ? -1 : a > b ? 1 : 0;
              })
            : ITREB_CLASS_ORDER.filter(c => byClass[c])
              .concat(Object.keys(byClass).filter(c => ITREB_CLASS_ORDER.indexOf(c) === -1).sort());
          const rows = ordered.map(c => {
            const st = setupStats[c] || { workingDays: 0, avgHours: 0, roundedAvgHours: 0, setupHours: 0, setupCount: 0 };
            const b = byClass[c];
            return { Class: c, workingDays: st.workingDays, avgHours: st.avgHours, roundedAvgHours: st.roundedAvgHours, setupHours: st.setupHours || 0, setupCount: st.setupCount || 0, actualHours: b.actualHours, normalHours: b.normalHours, episodicHours: b.episodicHours, enrolled: b.enrolled, P0: b.P0, P1: b.P1, P2: b.P2, P3: b.P3 };
          });
          setReportRows(rows);
          setReportMeta({ termId: selectedTerm, startKey, endKey, breakdown });
          setGenerated(true);
          if (!rows.length) setError('No students or setup rows in this period.');
        } catch (err) {
          setError('Failed to generate report: ' + err.message);
        }
        setIsLoading(false);
      };

      // Total row (sums all class rows).
      const totalRow = (() => {
        const t = { Class: 'Total', workingDays: 0, avgHours: 0, roundedAvgHours: 0, setupHours: 0, setupCount: 0, actualHours: 0, normalHours: 0, episodicHours: 0, enrolled: { B: 0, G: 0, T: 0 }, P0: { B: 0, G: 0, T: 0 }, P1: { B: 0, G: 0, T: 0 }, P2: { B: 0, G: 0, T: 0 }, P3: { B: 0, G: 0, T: 0 } };
        reportRows.forEach(r => {
          t.workingDays += r.workingDays; t.setupHours = Math.round((t.setupHours + (r.setupHours || 0)) * 100) / 100; t.setupCount += r.setupCount || 0; t.actualHours = Math.round((t.actualHours + (r.actualHours || 0)) * 100) / 100; t.normalHours = Math.round((t.normalHours + (r.normalHours || 0)) * 100) / 100; t.episodicHours = Math.round((t.episodicHours + (r.episodicHours || 0)) * 100) / 100;
          ['enrolled', 'P0', 'P1', 'P2', 'P3'].forEach(k => { t[k].B += r[k].B; t[k].G += r[k].G; t[k].T += r[k].T; });
        });
        // Total Average Hour is the overall mean across ALL deduped setup rows
        // (total setup hours / total rows) — not the sum of the per-row means.
        // Rounded Average Hour is that same overall mean rounded to the
        // nearest standard session length.
        t.avgHours = t.setupCount ? Math.round((t.setupHours / t.setupCount) * 100) / 100 : 0;
        t.roundedAvgHours = t.setupCount ? roundToStandardHour_(t.setupHours / t.setupCount) : 0;
        return t;
      })();

      const downloadCSV = () => {
        if (!reportRows.length) { setError('No data to download'); return; }
        const headers = ['Class', 'Working Days', 'Average Hour', 'Rounded Average Hour', 'Actual Hours', 'Normal Hours', 'Episodic Hours', 'Enrolled Boys', 'Enrolled Girls', 'Enrolled Total', 'P0 Boys', 'P0 Girls', 'P0 Total', 'P1 Boys', 'P1 Girls', 'P1 Total', 'P2 Boys', 'P2 Girls', 'P2 Total', 'P3 Boys', 'P3 Girls', 'P3 Total'];

        };
        reportRows.forEach(pushRow);

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'itreb_report_' + (reportMeta.termId || '') + '_' + (reportMeta.endKey || '') + (reportMeta.breakdown === 'section' ? '_section' : '') + '.csv';
        document.body.appendChild(a);

      const filteredRows = searchQuery

        : reportRows;
      const thFixed = 'border border-gray-300 dark:border-gray-600 p-2 bg-gray-100 dark:bg-gray-700';
      const thGroup = 'border border-gray-300 dark:border-gray-600 p-2 text-center bg-blue-100 dark:bg-blue-900';
      const tdCenter = 'border border-gray-300 dark:border-gray-600 p-2 text-center';
      const rowCells = (r) => ([r.enrolled.B, r.enrolled.G, r.enrolled.T, r.P0.B, r.P0.G, r.P0.T, r.P1.B, r.P1.G, r.P1.T, r.P2.B, r.P2.G, r.P2.T, r.P3.B, r.P3.G, r.P3.T].map((v, i) => (
        <td key={i} className={tdCenter}>{v}</td>
      )));

      return (

          <div className="flex items-center mb-4">
            <i className="uil uil-clock text-2xl text-accent mr-2"></i>

          </div>

                    <option value="quarterly">Quarterly (QTD)</option>
                    <option value="yearly">Yearly</option>
                  </select>
                </div>
                <div className="form-field">
                  <label htmlFor="itrebBreakdown">Breakdown</label>
                  <select
                    className="form-input"
                    id="itrebBreakdown"
                    value={breakdown}
                    onChange={e => { setBreakdown(e.target.value); resetResults(); }}
                  >
                    <option value="class">Class</option>
                    <option value="section">Section</option>
                  </select>
                </div>
                {periodType === 'monthly' && (
                  <>
                    <div className="form-field">
                      <label htmlFor="itrebMonth">Month</label>
                      <select
                        className="form-input"
                        id="itrebMonth"
                        value={selectedMonth}
                        onChange={e => { setSelectedMonth(e.target.value); resetResults(); }}
                        disabled={!selectedTerm}
                      >
                        <option value="" disabled>Select Month</option>
                        {MONTH_NAMES.map((m, i) => <option key={i + 1} value={String(i + 1).padStart(2, '0')}>{m}</option>)}
                      </select>
                    </div>
                    <div className="form-field">
                      <label htmlFor="itrebYear">Year</label>
                      <select
                        className="form-input"
                        id="itrebYear"
                        value={selectedYear}

                      id="itrebQuarter"

              </div>
              <div className="form-actions">
                <button type="submit" disabled={isLoading} className={`btn-primary ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}>
                  {isLoading ? <><i className="uil uil-spinner text-xl loading-spinner"></i> Generating...</> : 'Generate Report'}
                </button>
                <button
                  type="button"
                  onClick={downloadCSV}
                  disabled={reportRows.length === 0 || isLoading}

            </form>

          <div className="p-2 mb-4 text-xs text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded">
            <strong>How it works:</strong>&nbsp;

              </div>

                    </tr>
                    <tr>
                      {['Boys', 'Girls', 'Total', 'Boys', 'Girls', 'Total', 'Boys', 'Girls', 'Total', 'Boys', 'Girls', 'Total', 'Boys', 'Girls', 'Total', 'Boys', 'Girls', 'Total'].map((h, i) => (
                        <th key={i} className={thGroup + ' text-xs'}>{h}</th>
                      ))}

                  </thead>
                  <tbody>
                    {filteredRows.map((row, idx) => (

                      </tr>
                    ))}
                    <tr className="font-bold bg-gray-100 dark:bg-gray-700">
                      <td className="border border-gray-300 dark:border-gray-600 p-2 whitespace-nowrap">{totalRow.Class}</td>

                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

function BatchHoursLog({ isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, username }) {
  const [logData, setLogData] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  const [classSectionFilter, setClassSectionFilter] = useState('');
  const [userIdFilter, setUserIdFilter] = useState('');

  const recId = userPermissions[username]?.REC_ID || '';

  const formatLogDate = (val) => {
    if (!val) return '';
    if (typeof val === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(val)) return val; // already dd-MMM-yyyy
    const dt = new Date(val);
    if (isNaN(dt)) return val;
    const day = dt.getDate().toString().padStart(2, '0');
    const month = dt.toLocaleString('default', { month: 'short' });
    return `${day}-${month}-${dt.getFullYear()}`;
  };

  const loadLog = async () => {
    setIsLoading(true);
    try {
      // getSheetData REC-scopes by exact REC_ID match server-side — only this REC's rows come back
      const result = await callWithRetry('getSheetData', 'Batch_Hours_Log', recId);
      const sorted = [...result].sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
      setLogData(sorted);
      setLoaded(true);
    } catch (err) {
      // Sheet may not exist yet if no batch hours update has ever happened
      if ((err.message || '').toLowerCase().includes('not found')) {
        setLogData([]);
        setLoaded(true);
      } else {
        setError('Failed to load batch hours log: ' + err.message);
      }
    }
    setIsLoading(false);
  };

  useEffect(() => {
    loadLog();
  }, []);

  const classSections = [...new Set(logData.map(r => r.Class_Section).filter(Boolean))].sort();
  const userIds = [...new Set(logData.map(r => r.UserID).filter(Boolean))].sort();

  const filteredData = logData.filter(row => {
    if (fromDate && row.Date < fromDate) return false;
    if (toDate && row.Date > toDate) return false;
    if (classSectionFilter && row.Class_Section !== classSectionFilter) return false;
    if (userIdFilter && row.UserID !== userIdFilter) return false;
    return true;
  });

  const clearFilters = () => {
    setFromDate('');
    setToDate('');
    setClassSectionFilter('');
    setUserIdFilter('');
  };

  const columnLabels = {

    Old_Category: 'Old Category', New_Category: 'New Category', UserID: 'Updated By', REC_ID: 'REC', Timestamp: 'Timestamp'
  };

  const downloadCSV = () => {
    if (filteredData.length === 0) { setError('No data to download'); return; }

    filteredData.forEach(row => {

    });

    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `batch_hours_log_${new Date().toISOString().split('T')[0]}.csv`;

  const downloadPNG = async () => {

    const reportDiv = document.createElement('div');

        </tr></thead>
        <tbody>
    `;

  return (

      <div className="form-container mb-6">

            <select className="form-input" id="bhlClassSection" value={classSectionFilter} onChange={e => setClassSectionFilter(e.target.value)}>

function AttendanceCorrectionLog({ isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, username }) {
  const [logData, setLogData] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  const [studentFilter, setStudentFilter] = useState('');
  const [classSectionFilter, setClassSectionFilter] = useState('');
  const [correctedByFilter, setCorrectedByFilter] = useState('');

  const recId = userPermissions[username]?.REC_ID || '';

  const formatLogDate = (val) => {
    if (!val) return '';
    if (typeof val === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(val)) return val;
    const dt = new Date(val);
    if (isNaN(dt)) return val;
    const day = dt.getDate().toString().padStart(2, '0');
    const month = dt.toLocaleString('default', { month: 'short' });
    return `${day}-${month}-${dt.getFullYear()}`;
  };

  const loadLog = async () => {
    setIsLoading(true);
    try {
      const result = await callWithRetry('getSheetData', 'Attendance_Correction_Log', recId);
      const sorted = [...result].sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
      setLogData(sorted);
      setLoaded(true);
    } catch (err) {
      if ((err.message || '').toLowerCase().includes('not found')) {
        setLogData([]);
        setLoaded(true);
      } else {
        setError('Failed to load correction log: ' + err.message);
      }
    }
    setIsLoading(false);
  };

  useEffect(() => {
    loadLog();
  }, []);

  const classSections = [...new Set(logData.map(r => r.Class_Section).filter(Boolean))].sort();
  const correctors = [...new Set(logData.map(r => r.Corrected_By).filter(Boolean))].sort();

  const filteredData = logData.filter(row => {
    if (fromDate && row.Date < fromDate) return false;
    if (toDate && row.Date > toDate) return false;
    if (studentFilter && !`${row.Std_ID} ${row.Student_Name}`.toLowerCase().includes(studentFilter.toLowerCase())) return false;
    if (classSectionFilter && row.Class_Section !== classSectionFilter) return false;
    if (correctedByFilter && row.Corrected_By !== correctedByFilter) return false;
    return true;
  });

  const clearFilters = () => {
    setFromDate('');
    setToDate('');
    setStudentFilter('');
    setClassSectionFilter('');
    setCorrectedByFilter('');
  };

const columns = ['Date', 'Std_ID', 'Student_Name', 'Class_Section', 'Old_Status', 'New_Status', 'Old_Hours', 'New_Hours', 'Old_Category', 'New_Category', 'Reason', 'Comment', 'Corrected_By', 'REC_ID', 'Timestamp'];
const columnLabels = {
  Date: 'Date', Std_ID: 'Std ID', Student_Name: 'Student Name', Class_Section: 'Class Section',
  Old_Status: 'Old Status', New_Status: 'New Status',
  Old_Hours: 'Old Hours', New_Hours: 'New Hours',
  Old_Category: 'Old Category', New_Category: 'New Category',
  Reason: 'Reason', Comment: 'Comment',
  Corrected_By: 'Corrected By', REC_ID: 'REC', Timestamp: 'Timestamp'
};

  const downloadCSV = () => {
    if (filteredData.length === 0) { setError('No data to download'); return; }
    let csv = columns.map(c => columnLabels[c]).join(',') + '\n';
    filteredData.forEach(row => {
      csv += columns.map(c => `"${(c === 'Date' ? formatLogDate(row[c]) : (mcCell(row, c) ?? '')).toString().replace(/"/g, '""')}"`).join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `attendance_correction_log_${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    setSuccessMessage('CSV downloaded!');
  };

  const downloadPNG = async () => {
    if (filteredData.length === 0) { setError('No data to download'); return; }
    setIsLoading(true);
    const reportDiv = document.createElement('div');
    reportDiv.setAttribute('data-theme', 'light');
    reportDiv.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:1200px;background:white;padding:40px;font-family:sans-serif;color:#1a2c3e;';
    const currentDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    let html = `
      <div style="margin-bottom:20px;text-align:center;">
        <h1 style="color:#1a2c3e;margin-bottom:10px;">Attendance Correction Log</h1>
        <div style="font-size:13px;color:#666;">Generated on ${currentDate}</div>
        <hr style="border:2px solid #1a73e8;margin-top:10px;">
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead><tr style="background:#1a73e8;color:white;">
          ${columns.map(c => `<th style="padding:8px;text-align:left;border:1px solid #ddd;">${columnLabels[c]}</th>`).join('')}
        </tr></thead>
        <tbody>
    `;
    filteredData.forEach((row, idx) => {
      html += `<tr style="background:${idx % 2 === 0 ? '#ffffff' : '#f8f9fa'};">`;
      columns.forEach(c => {
        const val = c === 'Date' ? formatLogDate(row[c]) : (mcCell(row, c) ?? '');
        html += `<td style="padding:6px 8px;border:1px solid #ddd;">${val}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    reportDiv.innerHTML = html;
    document.body.appendChild(reportDiv);
    await new Promise(r => setTimeout(r, 100));
    try {
      const canvas = await html2canvas(reportDiv, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      document.body.removeChild(reportDiv);
      const link = document.createElement('a');
      link.download = `attendance_correction_log_${new Date().toISOString().split('T')[0]}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      setSuccessMessage('PNG downloaded!');
    } catch (err) {
      document.body.removeChild(reportDiv);
      setError('Failed to generate PNG: ' + err.message);
    }
    setIsLoading(false);
  };

  return (
    <div className="card p-6">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center">
          <i className="uil uil-history text-2xl text-accent mr-2"></i>
          <h2 className="text-xl font-semibold">Attendance Correction Log</h2>
        </div>
        <button onClick={loadLog} className="btn-outline" disabled={isLoading}>
          <i className={`uil uil-refresh ${isLoading ? 'loading-spinner' : ''}`}></i> Refresh
        </button>
      </div>

      <div className="form-container mb-6">
        <div className="form-row">
          <div className="form-field">
            <label htmlFor="aclFromDate">From Date</label>
            <input type="date" className="form-input" id="aclFromDate" value={fromDate} onChange={e => setFromDate(e.target.value)} placeholder="From date" />
          </div>
          <div className="form-field">
            <label htmlFor="aclToDate">To Date</label>
            <input type="date" className="form-input" id="aclToDate" value={toDate} onChange={e => setToDate(e.target.value)} placeholder="To date" />
          </div>
          <div className="form-field">
            <label htmlFor="aclStudent">Student</label>
            <input type="text" className="form-input" id="aclStudent" value={studentFilter} onChange={e => setStudentFilter(e.target.value)} placeholder="Search by Std ID or name" />
          </div>
          <div className="form-field">
            <label htmlFor="aclClassSection">Class Section</label>
            <select className="form-input" id="aclClassSection" value={classSectionFilter} onChange={e => setClassSectionFilter(e.target.value)}>
              <option value="">All Class Sections</option>
              {classSections.map(cs => <option key={cs} value={cs}>{cs}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label htmlFor="aclCorrectedBy">Corrected By</label>
            <select className="form-input" id="aclCorrectedBy" value={correctedByFilter} onChange={e => setCorrectedByFilter(e.target.value)}>
              <option value="">All Users</option>
              {correctors.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
        </div>
        <div className="form-actions">
          <button onClick={clearFilters} className="btn-outline">Clear Filters</button>
          <button onClick={downloadCSV} disabled={filteredData.length === 0} className={`btn-secondary ${filteredData.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}`}>
            <i className="uil uil-file-csv"></i> CSV
          </button>
          <button onClick={downloadPNG} disabled={filteredData.length === 0 || isLoading} className={`btn-secondary ${filteredData.length === 0 || isLoading ? 'opacity-50 cursor-not-allowed' : ''}`}>
            <i className="uil uil-image-v"></i> PNG
          </button>
        </div>
      </div>

      {isLoading ? (
        <p className="text-gray-500">Loading...</p>
      ) : !loaded ? null : filteredData.length === 0 ? (
        <p className="text-gray-500">No attendance corrections logged{logData.length === 0 ? ' yet' : ' for the selected filters'}.</p>
      ) : (
        <div className="table-container max-h-[600px]">
          <table className="min-w-full">
            <thead className="sticky-header">
              <tr>
                {columns.map(c => (
                  <th key={c} className="whitespace-nowrap">{columnLabels[c]}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filteredData.map((row, index) => (
                <tr key={index}>
                <td className="whitespace-nowrap">{formatLogDate(row.Date)}</td>
<td className="whitespace-nowrap">{row.Std_ID || ''}</td>
<td className="whitespace-nowrap">{row.Student_Name || ''}</td>
<td className="whitespace-nowrap">{row.Class_Section || ''}</td>
<td className="whitespace-nowrap">{row.Old_Status || ''}</td>
<td className="whitespace-nowrap">{row.New_Status || ''}</td>
<td className="whitespace-nowrap">{mcCell(row, 'Old_Hours') || '—'}</td>
<td className="whitespace-nowrap">{mcCell(row, 'New_Hours') || '—'}</td>
<td className="whitespace-nowrap">{mcCell(row, 'Old_Category') || '—'}</td>
<td className="whitespace-nowrap">{mcCell(row, 'New_Category') || '—'}</td>
<td className="whitespace-nowrap">{row.Reason || '—'}</td>

        </div>
      )}

  );

// ============ TRANSFER CERTIFICATE (v7.10, v7.11, v7.14, v7.15) ============
// One HTML layout shared by the on-screen view, the Print window and the
// PNG download, mirroring the sample certificate
// (TC___2029_Affan_Madad_Ali_Khawaja.pdf). Data comes from
// getTransferCertificateData — the TC row is a snapshot, so re-printing
// never changes even if the student row is edited later.
const TC_ERROR_REASONS = ['Wrong enrolment', 'Duplicate'];
// v7.15: the four Annexure 5B documents. 'Progress File' stored on old
// rows reads as 'Progress Card' on the certificate.
const TC_DOCS = ['Evaluation Card', 'Progress Card', 'Curriculum Set', 'Activity Book'];
// v7.15: leaving reasons + countries come from the managed tables
// (Leaving_Reasons / Countries sheets) — no hard-coded list any more.
// A reason's Category drives which fields the popup shows.
const LEAVING_REASON_CATEGORIES = ['Moving', 'Moving-Abroad', 'Temporary', 'Medical', 'Left REC'];
const TC_CONTACT_RELATIONS = ['Father', 'Mother', 'Guardian'];
const TC_PHONE_RE = /^03\d{9}$/;

// First word = First Name, last word = Last Name, the rest = Middle Name.
// A single-word name goes in First Name and the rest stay blank.
function tcSplitName_(full) {
  const parts = String(full || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return { first: parts[0] || '', middle: '', last: '' };
  if (parts.length === 2) return { first: parts[0], middle: '', last: parts[1] };
  return { first: parts[0], middle: parts.slice(1, -1).join(' '), last: parts[parts.length - 1] };
}

function tcLongDate_(v) {
  if (!v) return '';
  const d = parseAnyDate(v);
  if (!d) return String(v);
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function tcShortDate_(v) {
  if (!v) return '';
  const d = parseAnyDate(v);
  if (!d) return String(v);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function tcEscape_(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// v7.19: group consecutive months sharing one term label into a single run,
// so the term name prints once per range instead of under every month.
// Months with no label form a blank run of their own. Used by the printed
// certificate and by the Deactivate popup preview, from the same att array.
function tcTermGroups_(att) {
  const runs = [];
  (att || []).forEach(function (m) {
    const label = String((m && m.termLabel) || '');
    const last = runs[runs.length - 1];
    if (last && last.label === label) last.count++;
    else runs.push({ label: label, count: 1 });
  });
  return runs;
}

// v7.15: what the Transfer Certificates tab shows after the reason — the
// REC name for a picked REC code (a typed name is already stored as-is),
// or 'Country — City' for a Migration.
function tcTabDestination_(item, recNames) {
  if (String(item.Destination_Type || '') === 'REC' && item.Destination) {
    const found = (recNames || []).find(r => String(r.REC_Code) === String(item.Destination));
    if (found) return found.REC_Name;
  }
  return item.Destination || '';
}

function TransferCertificateView({ tcNumber, onClose, setIsLoading, setError, setSuccessMessage }) {
  const [cert, setCert] = useState(null);
  const [loading, setLoading] = useState(true);
  const certRef = React.useRef(null);
  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    callWithRetry('getTransferCertificateData', tcNumber)
      .then(result => { if (!cancelled) setCert(result); })
      .catch(err => { if (!cancelled) setError('Could not load the transfer certificate: ' + err.message); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [tcNumber]);
  useEffect(() => {
    if (certRef.current && cert) certRef.current.innerHTML = tcCertificateHTML_(cert);
  }, [cert]);
  const printCert = () => {
    if (!cert) return;
    const w = window.open('', '_blank');
    if (!w) { setError('Please allow pop-ups to print the certificate.'); return; }
    const title = 'Transfer Certificate ' + (cert.tc.TC_Number || cert.tc.Std_ID || '');
    w.document.write('<!DOCTYPE html><html><head><title>' + tcEscape_(title) + '</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#111827;margin:20px;} @media print { body { margin: 0; } }</style></head><body>' + tcCertificateHTML_(cert) + '</body></html>');
    w.document.close();
    w.focus();
    w.print();
  };
  // PNG download — same off-screen div + html2canvas pattern as the reports.
  const downloadPNG = async () => {
    if (!cert) return;
    setIsLoading(true);
    const div = document.createElement('div');
    div.setAttribute('data-theme', 'light');
    div.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:1000px;background:white;padding:40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111827;';
    div.innerHTML = tcCertificateHTML_(cert);
    document.body.appendChild(div);
    await new Promise(r => setTimeout(r, 100));
    try {
      const canvas = await html2canvas(div, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      document.body.removeChild(div);
      const a = document.createElement('a');
      a.download = 'transfer_certificate_' + (cert.tc.TC_Number || cert.tc.Std_ID || 'record') + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      setSuccessMessage('Certificate PNG downloaded!');
    } catch (err) {
      document.body.removeChild(div);
      setError('Failed to generate PNG: ' + err.message);
    }
    setIsLoading(false);
  };
  // PDF download — same capture as the PNG, then placed on one A4 page.
  const downloadPDF = async () => {
    if (!cert) return;
    if (!window.jspdf || !window.jspdf.jsPDF) { setError('PDF library could not be loaded — please use Print instead.'); return; }
    setIsLoading(true);
    const div = document.createElement('div');
    div.setAttribute('data-theme', 'light');
    div.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:1000px;background:white;padding:40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111827;';
    div.innerHTML = tcCertificateHTML_(cert);
    document.body.appendChild(div);
    await new Promise(r => setTimeout(r, 100));
    try {
      const canvas = await html2canvas(div, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      document.body.removeChild(div);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageW = 210, pageH = 297, margin = 10;
      let imgW = pageW - margin * 2;
      let imgH = canvas.height * imgW / canvas.width;
      if (imgH > pageH - margin * 2) { imgH = pageH - margin * 2; imgW = canvas.width * imgH / canvas.height; }
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (pageW - imgW) / 2, margin, imgW, imgH);
      pdf.save('transfer_certificate_' + (cert.tc.TC_Number || cert.tc.Std_ID || 'record') + '.pdf');
      setSuccessMessage('Certificate PDF downloaded!');
    } catch (err) {
      document.body.removeChild(div);
      setError('Failed to generate PDF: ' + err.message);
    }
    setIsLoading(false);
  };
  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-start justify-center z-50 p-4 overflow-y-auto">
      <div className="card p-6 max-w-4xl w-full my-8">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h3 className="text-lg font-semibold">Transfer Certificate{cert && cert.tc.TC_Number ? ' — ' + cert.tc.TC_Number : ''}</h3>
          <div className="flex flex-wrap gap-2">
            <button onClick={printCert} disabled={!cert || loading} className="btn-primary">Print</button>
            <button onClick={downloadPNG} disabled={!cert || loading} className="btn-secondary">Download PNG</button>
            <button onClick={downloadPDF} disabled={!cert || loading} className="btn-secondary">Download PDF</button>
            <button onClick={onClose} className="btn-outline">Close</button>
          </div>
        </div>
        {loading ? (
          <p className="text-gray-500">Loading certificate…</p>
        ) : !cert ? (
          <p className="text-gray-500">Certificate could not be loaded.</p>
        ) : (
          <div ref={certRef} className="bg-white text-gray-900 p-2 overflow-x-auto"></div>
        )}
      </div>
    </div>
  );
}

      const parseDDMMMYYYYToDate = (dateStr) => {
  if (!dateStr) return '';
  try {
    // Parse the dd-MMM-yyyy format directly
    const [day, monthStr, year] = dateStr.split('-');
    const monthMap = {
      'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06',
      'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'
    };
    const month = monthMap[monthStr];
    if (!month) return dateStr; // Return original if parsing fails
    
    // Format as yyyy-mm-dd for HTML date input
    return `${year}-${month}-${day.padStart(2, '0')}`;
  } catch (e) {
    return dateStr; // Return original if parsing fails
  }
};

const formatDateToDDMMMYYYY = (dateStr) => {
  if (!dateStr) return '';
  try {
    // If it's already in dd-MMM-yyyy format, return as is
    if (typeof dateStr === 'string' && dateStr.match(/^\d{2}-[A-Za-z]{3}-\d{4}$/)) {
      return dateStr;
    }
    
    // Parse the date string
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return dateStr; // Return original if invalid
    
    const day = date.getDate().toString().padStart(2, '0');
    const month = date.toLocaleString('default', { month: 'short' });
    const year = date.getFullYear();
    
    return `${day}-${month}-${year}`;
  } catch (e) {
    return dateStr; // Return original if formatting fails
  }
};
