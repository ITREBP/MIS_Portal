    function AttendanceReportsPage({ data, isLoading, setIsLoading, setError, setSuccessMessage }) {
  const [dailyDate, setDailyDate] = useState('');
  const [dailyClass, setDailyClass] = useState('');
  const [dailySection, setDailySection] = useState('');
  const [dailyFormat, setDailyFormat] = useState('png');

  const [reportType, setReportType] = useState('single');
  const [monthlyClass, setMonthlyClass] = useState('');
  const [monthlySection, setMonthlySection] = useState('');
  const [monthlyStudentId, setMonthlyStudentId] = useState('');
  const [monthlyMonth, setMonthlyMonth] = useState('');
  const [monthlyFormat, setMonthlyFormat] = useState('png');
  const [downloadHistory, setDownloadHistory] = useState([]);

  const classesList = [...new Set(data.student_data.map(s => s.Student_Class).filter(Boolean))];
  const sectionsByClass = {};
  classesList.forEach(cls => {
    sectionsByClass[cls] = [...new Set(data.student_data.filter(s => s.Student_Class === cls).map(s => s.Student_Section).filter(Boolean))];
  });

  // Handles both "dd-MMM-yyyy" strings (Portal's own format) and native Date/ISO strings
  const parseAnyDate = (d) => {
    if (!d) return null;
    if (typeof d === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(d)) {
      const [day, monStr, year] = d.split('-');
      const monthMap = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
      return new Date(parseInt(year), monthMap[monStr], parseInt(day));
    }
    const dt = new Date(d);
    return isNaN(dt) ? null : dt;
  };

  const toYMD = (d) => {
    const dt = parseAnyDate(d);
    if (!dt) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  };

  const monthlyStudents = monthlyClass && monthlySection
    ? data.student_data.filter(s => s.Student_Class === monthlyClass && s.Student_Section === monthlySection)
    : [];

  const availableMonths = (() => {
    const source = reportType === 'single' && monthlyStudentId
      ? data.student_attendance.filter(a => String(a.Std_ID) === String(monthlyStudentId))
      : (monthlyClass && monthlySection ? data.student_attendance.filter(a => a.Student_Class === monthlyClass && a.Student_Section === monthlySection) : []);
    const set = new Set();
    source.forEach(a => {
      const dt = parseAnyDate(a.Date);
      if (dt) set.add(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`);
    });
    return Array.from(set).sort((a, b) => b.localeCompare(a)).map(key => {
      const [y, m] = key.split('-').map(Number);
      return { key, display: `${new Date(y, m - 1).toLocaleString('default', { month: 'long' })} ${y}` };
    });
  })();

  const computeSummary = (stdId, month, year) => {
    let presents = 0, absents = 0, leaves = 0, totalDays = 0;
    data.student_attendance.forEach(r => {
      if (String(r.Std_ID) !== String(stdId)) return;
      const dt = parseAnyDate(r.Date);
      if (!dt || dt.getFullYear() !== year || (dt.getMonth() + 1) !== month) return;
      totalDays++;
      const st = (r.Status || '').toLowerCase();
      if (st === 'present') presents++;
      else if (st === 'absent') absents++;
      else if (st === 'leave') leaves++;
    });
    return { presents, absents, leaves, totalDays, presentPercentage: totalDays > 0 ? Math.round((presents / totalDays) * 10000) / 100 : 0 };
  };

  const downloadCSVReport = (rows, filename) => {
    const headers = Object.keys(rows[0]);
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
      csv += headers.map(h => `"${(row[h] ?? '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
  };

  const getStatusStyle = (status) => {
    switch ((status || '').toLowerCase()) {
      case 'present': return 'color:#2e7d32;font-weight:600;background-color:#e8f5e9;';
      case 'absent': return 'color:#c62828;font-weight:600;background-color:#ffebee;';
      case 'leave': return 'color:#ef6c00;font-weight:600;background-color:#fff3e0;';
      default: return 'color:#1a2c3e;font-weight:500;background-color:#f5f5f5;';
    }
  };

  const getPercentColor = (pct) => (pct >= 75 ? '#2e7d32' : pct >= 50 ? '#ef6c00' : '#c62828');
  const getPercentBg = (pct) => (pct >= 75 ? '#e8f5e9' : pct >= 50 ? '#fff3e0' : '#ffebee');

  const renderAsPNG = async (rows, filename, title, isMonthly) => {
    setIsLoading(true);
    const reportDiv = document.createElement('div');
    reportDiv.setAttribute('data-theme', 'light');
    reportDiv.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:1100px;background:white;padding:40px;font-family:sans-serif;color:#1a2c3e;';
    const currentDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const headers = Object.keys(rows[0]);
    let html = `
      <div style="margin-bottom:20px;text-align:center;">
        <h1 style="color:#1a2c3e;margin-bottom:10px;">${title}</h1>
        <div style="font-size:13px;color:#666;">Generated on ${currentDate}</div>
        <hr style="border:2px solid #1a73e8;margin-top:10px;">
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:#1a73e8;color:white;">
          ${headers.map(h => `<th style="padding:10px;text-align:left;border:1px solid #ddd;">${h}</th>`).join('')}
        </tr></thead>
        <tbody>
    `;
    rows.forEach((row, idx) => {
      const isTotal = row['Student Name'] === 'CLASS TOTAL';
      const bg = isTotal ? '#e3f2fd' : (idx % 2 === 0 ? '#ffffff' : '#f8f9fa');
      html += `<tr style="background:${bg};">`;
      headers.forEach(h => {
        let val = row[h] ?? '';
        let style = `padding:8px 10px;border:1px solid #ddd;${isTotal ? 'font-weight:700;' : ''}`;
        if (h === 'Status') style += getStatusStyle(val);
        if (h === 'Attendance %') {
          const pct = parseFloat(val) || 0;
          style += `color:${isTotal ? '#1a2c3e' : getPercentColor(pct)};font-weight:700;background:${isTotal ? 'transparent' : getPercentBg(pct)};`;
        }
        html += `<td style="${style}">${val}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    reportDiv.innerHTML = html;
    document.body.appendChild(reportDiv);
    await new Promise(r => setTimeout(r, 100));
    try {
      const canvas = await html2canvas(reportDiv, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      document.body.removeChild(reportDiv);
      const link = document.createElement('a');
      link.download = `${filename}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      setSuccessMessage('PNG report downloaded!');
    } catch (err) {
      document.body.removeChild(reportDiv);
      setError('Failed to generate PNG: ' + err.message);
    }
    setIsLoading(false);
  };

  const logDownload = (name, format) => {
    setDownloadHistory(prev => [{ name, format, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }, ...prev].slice(0, 5));
  };

  const generateDaily = (e) => {
    e.preventDefault();
    if (!dailyDate || !dailyClass || !dailySection) { setError('Please select date, class and section.'); return; }
    let rows = data.student_attendance
      .filter(a => a.Student_Class === dailyClass && a.Student_Section === dailySection && toYMD(a.Date) === dailyDate)
      .map(a => ({ 'Student Name': a.Student_Name, 'Student ID': a.Std_ID, 'Class': a.Student_Class, 'Section': a.Student_Section, 'Date': dailyDate, 'Status': a.Status }));
    if (rows.length === 0) {
      rows = data.student_data
        .filter(s => s.Student_Class === dailyClass && s.Student_Section === dailySection)
        .map(s => ({ 'Student Name': s.Student_Name, 'Student ID': s.Std_ID, 'Class': s.Student_Class, 'Section': s.Student_Section, 'Date': dailyDate, 'Status': 'Not Marked' }));
    }
    if (rows.length === 0) { setError('No attendance data found.'); return; }
    rows.sort((a, b) => (a['Student Name'] || '').localeCompare(b['Student Name'] || ''));
    const filename = `attendance_${dailyClass}_${dailySection}_${dailyDate}`;
    if (dailyFormat === 'csv') {
      downloadCSVReport(rows, `${filename}.csv`);
      setSuccessMessage('CSV report downloaded!');
    } else {
      renderAsPNG(rows, filename, 'Daily Attendance Report', false);
    }
    logDownload(`Attendance - ${dailyClass}-${dailySection} - ${dailyDate}`, dailyFormat.toUpperCase());
  };

  const generateMonthly = (e) => {
    e.preventDefault();
    if (!monthlyClass || !monthlySection || !monthlyMonth) { setError('Please fill all fields.'); return; }
    const [year, month] = monthlyMonth.split('-').map(Number);
    const monthName = new Date(year, month - 1).toLocaleString('default', { month: 'long' });

    if (reportType === 'single') {
      if (!monthlyStudentId) { setError('Please select a student.'); return; }
      const student = data.student_data.find(s => String(s.Std_ID) === String(monthlyStudentId));
      const summary = computeSummary(monthlyStudentId, month, year);
      const rows = [{
        'Student Name': student?.Student_Name || '', 'Student ID': monthlyStudentId, 'Class Section': `${monthlyClass}-${monthlySection}`,
        'Month': monthName, 'Year': year, 'Presents': summary.presents, 'Absents': summary.absents, 'Leaves': summary.leaves,
        'Total Days': summary.totalDays, 'Attendance %': `${summary.presentPercentage}%`
      }];
      const filename = `${(student?.Student_Name || 'student').replace(/\s+/g, '_')}_${monthlyClass}_${monthlySection}_${monthName}_${year}`;
      if (monthlyFormat === 'csv') {
        downloadCSVReport(rows, `student_summary_${filename}.csv`);
        setSuccessMessage('CSV report downloaded!');
      } else {
        renderAsPNG(rows, `student_summary_${filename}`, 'Student Monthly Summary', true);
      }
      logDownload(`Student Summary - ${student?.Student_Name || monthlyStudentId} - ${monthName} ${year}`, monthlyFormat.toUpperCase());
    } else {
      if (monthlyStudents.length === 0) { setError('No students found.'); return; }
      const rows = monthlyStudents.map(s => {
        const summary = computeSummary(s.Std_ID, month, year);
        return {
          'Student Name': s.Student_Name, 'Student ID': s.Std_ID, 'Class Section': `${monthlyClass}-${monthlySection}`,
          'Month': monthName, 'Year': year, 'Presents': summary.presents, 'Absents': summary.absents, 'Leaves': summary.leaves,
          'Total Days': summary.totalDays, 'Attendance %': `${summary.presentPercentage}%`
        };
      });
      const totalPresents = rows.reduce((s, r) => s + r.Presents, 0);
      const totalAbsents = rows.reduce((s, r) => s + r.Absents, 0);
      const totalLeaves = rows.reduce((s, r) => s + r.Leaves, 0);
      const totalDays = rows.reduce((s, r) => s + r['Total Days'], 0);
      rows.push({
        'Student Name': 'CLASS TOTAL', 'Student ID': '', 'Class Section': `${monthlyClass}-${monthlySection}`, 'Month': monthName, 'Year': year,
        'Presents': totalPresents, 'Absents': totalAbsents, 'Leaves': totalLeaves, 'Total Days': totalDays,
        'Attendance %': totalDays > 0 ? `${Math.round((totalPresents / totalDays) * 10000) / 100}%` : '0%'
      });
      const filename = `class_summary_${monthlyClass}_${monthlySection}_${monthName}_${year}`;
      if (monthlyFormat === 'csv') {
        downloadCSVReport(rows, `${filename}.csv`);
        setSuccessMessage('CSV report downloaded!');
      } else {
        renderAsPNG(rows, filename, 'Class Monthly Summary', true);
      }
      logDownload(`Class Summary - ${monthlyClass}-${monthlySection} - ${monthName} ${year}`, monthlyFormat.toUpperCase());
    }
  };

  return (
    <div className="card p-6">
      <div className="flex items-center mb-4">
        <i className="uil uil-file-download text-2xl text-blue-500 mr-2"></i>
        <h2 className="text-xl font-semibold">Attendance Reports</h2>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
        {/* Daily Attendance Report */}
        <div className="form-container">
          <h3 className="text-lg font-semibold mb-4">Daily Attendance Report</h3>
          <form onSubmit={generateDaily}>
            <div className="form-field">
              <input type="date" className="form-input" id="dailyDate" value={dailyDate} onChange={e => setDailyDate(e.target.value)} required />
              <label htmlFor="dailyDate">Date</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="dailyClass" value={dailyClass} onChange={e => { setDailyClass(e.target.value); setDailySection(''); }} required>
                <option value="" disabled>Select Class</option>
                {classesList.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <label htmlFor="dailyClass">Class</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="dailySection" value={dailySection} onChange={e => setDailySection(e.target.value)} required disabled={!dailyClass}>
                <option value="" disabled>Select Section</option>
                {(sectionsByClass[dailyClass] || []).map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <label htmlFor="dailySection">Section</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="dailyFormat" value={dailyFormat} onChange={e => setDailyFormat(e.target.value)}>
                <option value="png">PNG (High Quality)</option>
                <option value="csv">CSV</option>
              </select>
              <label htmlFor="dailyFormat">Format</label>
            </div>
            <button type="submit" disabled={isLoading} className={`btn-primary w-full ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}>
              <i className="uil uil-download"></i> Download Report
            </button>
          </form>
        </div>

        {/* Monthly Summary Report */}
        <div className="form-container">
          <h3 className="text-lg font-semibold mb-4">Monthly Summary Report</h3>
          <form onSubmit={generateMonthly}>
            <div className="form-field">
              <select className="form-input" id="reportType" value={reportType} onChange={e => { setReportType(e.target.value); setMonthlyMonth(''); }}>
                <option value="single">Single Student</option>
                <option value="all">All Students in Class</option>
              </select>
              <label htmlFor="reportType">Report Type</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="monthlyClass" value={monthlyClass} onChange={e => { setMonthlyClass(e.target.value); setMonthlySection(''); setMonthlyStudentId(''); setMonthlyMonth(''); }} required>
                <option value="" disabled>Select Class</option>
                {classesList.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <label htmlFor="monthlyClass">Class</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="monthlySection" value={monthlySection} onChange={e => { setMonthlySection(e.target.value); setMonthlyStudentId(''); setMonthlyMonth(''); }} required disabled={!monthlyClass}>
                <option value="" disabled>Select Section</option>
                {(sectionsByClass[monthlyClass] || []).map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <label htmlFor="monthlySection">Section</label>
            </div>
            {reportType === 'single' && (
              <div className="form-field">
                <select className="form-input" id="monthlyStudent" value={monthlyStudentId} onChange={e => { setMonthlyStudentId(e.target.value); setMonthlyMonth(''); }} required disabled={!monthlySection}>
                  <option value="" disabled>Select Student</option>
                  {monthlyStudents.map(s => <option key={s.Std_ID} value={s.Std_ID}>{s.Student_Name} ({s.Std_ID})</option>)}
                </select>
                <label htmlFor="monthlyStudent">Student</label>
              </div>
            )}
            <div className="form-field">
              <select className="form-input" id="monthlyMonth" value={monthlyMonth} onChange={e => setMonthlyMonth(e.target.value)} required>
                <option value="" disabled>Select Month</option>
                {availableMonths.map(m => <option key={m.key} value={m.key}>{m.display}</option>)}
              </select>
              <label htmlFor="monthlyMonth">Month</label>
            </div>
            <div className="form-field">
              <select className="form-input" id="monthlyFormat" value={monthlyFormat} onChange={e => setMonthlyFormat(e.target.value)}>
                <option value="png">PNG (High Quality)</option>
                <option value="csv">CSV</option>
              </select>
              <label htmlFor="monthlyFormat">Format</label>
            </div>
            <button type="submit" disabled={isLoading} className={`btn-primary w-full ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}>
              <i className="uil uil-download"></i> Download Summary
            </button>
          </form>
        </div>
      </div>

      <div className="form-container mt-6">
        <h3 className="text-lg font-semibold mb-3">Recent Downloads</h3>
        {downloadHistory.length === 0 ? (
          <p className="text-gray-500 text-center">No recent downloads</p>
        ) : (
          downloadHistory.map((h, i) => (
            <div key={i} className="flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700 last:border-0">
              <span><i className={`uil ${h.format === 'PNG' ? 'uil-image-v' : 'uil-file'} mr-2`}></i>{h.name}</span>
              <span className="text-sm text-gray-500">{h.time}</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function BatchHoursLog({ isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, username }) {
  const [logData, setLogData] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');

  const [userIdFilter, setUserIdFilter] = useState('');

  const recId = userPermissions[username]?.REC_ID || '';

  const formatLogDate = (val) => {
    if (!val) return '';
    if (typeof val === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(val)) return val; // already dd-MMM-yyyy
    const dt = new Date(val);
    if (isNaN(dt)) return val;
    const day = dt.getDate().toString().padStart(2, '0');
    const month = dt.toLocaleString('default', { month: 'short' });
    return `${day}-${month}-${dt.getFullYear()}`;
  };

  const loadLog = async () => {
    setIsLoading(true);
    try {
      // getSheetData REC-scopes by exact REC_ID match server-side — only this REC's rows come back
      const result = await callWithRetry('getSheetData', 'Batch_Hours_Log', recId);
      const sorted = [...result].sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
      setLogData(sorted);
      setLoaded(true);
    } catch (err) {
      // Sheet may not exist yet if no batch hours update has ever happened
      if ((err.message || '').toLowerCase().includes('not found')) {
        setLogData([]);
        setLoaded(true);
      } else {
        setError('Failed to load batch hours log: ' + err.message);
      }
    }
    setIsLoading(false);
  };

  useEffect(() => {
    loadLog();
  }, []);

  const classSections = [...new Set(logData.map(r => r.Class_Section).filter(Boolean))].sort();
  const userIds = [...new Set(logData.map(r => r.UserID).filter(Boolean))].sort();

    if (fromDate && row.Date < fromDate) return false;
    if (toDate && row.Date > toDate) return false;

    if (userIdFilter && row.UserID !== userIdFilter) return false;

  };

    });

        </tr></thead>
        <tbody>
    `;

    Student_Section: formData.Student_Section,
    Status: formData.Status || 'Active',
    Barcode_ID: formData.Barcode_ID || '',
    Gender: formData.Gender,
    Date_of_Joining: formData.Date_of_Joining || '',
    Unique_ID: formData.Unique_ID || '',
  };
  
  setIsLoading(true);
  setMessage('');
  setFormErrors({ general: 'Processing...' });
  
  if (editingIndex !== null) {
    const rowNumber = filteredData[editingIndex]._rowNumber;
    try {
      // For edit, pass recId too
      const result = await callWithRetry('updateSheetRow', 'Student_Data', rowNumber, studentData, username);
      if (result.success) {
        setSuccessMessage(result.message);
        setData(prev => ({
          ...prev,
          student_data: prev.student_data.map((item) =>
            item._rowNumber === rowNumber ? { ...item, ...result.data } : item
          ),
        }));
        setFormData({});
        setEditingIndex(null);
        setIsStdIdEditable(false);
        setFormErrors({});
        setError('');
      } else {
        setError(result.message || 'Update failed');
      }
    } catch (err) {
      setError('Update failed after retries: ' + err.message);
    }
    setIsLoading(false);
  } else {
    try {
      // ✅ PASS recId correctly
      const result = await callWithRetry('addStudent', studentData, username, recId);
      if (result.success) {
        setSuccessMessage(result.message);
        setData(prev => ({
          ...prev,
          student_data: [...prev.student_data, result.data],
        }));
        setFormData({});
        setIsAdding(false);
        setFormErrors({});
        setError('');
      } else {
        setError(result.message || 'Add failed');
      }
    } catch (err) {
      setError('Add failed after retries: ' + err.message);
    }
    setIsLoading(false);
  }
};

  const handleSubmit = async (e) => {
  e.preventDefault();
  if (!validateForm()) return;
  const targetTable = table === 'class_sections' ? subTab : table;
  const dataToSubmit = { ...formData };
  if (table === 'class_sections' && subTab === 'class_mappings') {
    dataToSubmit.Sections = formData.Sections;
  }
  if (table === 'teacher_assignments' && formData.Class_Section) {
    dataToSubmit.Class_Section = formData.Class_Section.join(',');
  }
  if (recId) dataToSubmit.REC_ID = recId;
  
  setIsLoading(true);
  setMessage('');
  
  if (editingIndex !== null) {
    const rowNumber = filteredData[editingIndex]._rowNumber;
    try {
            const result = await callWithRetry('updateSheetRow', targetTable, rowNumber, dataToSubmit, username);
      if (result.success) {
        setSuccessMessage('Record updated successfully');
        setData(prev => ({
          ...prev,
          [targetTable]: prev[targetTable].map((item) =>
            item._rowNumber === rowNumber ? { ...item, ...result.data } : item
          ),
        }));
        setFormData({});
        setEditingIndex(null);
        setFormErrors({});
        setError('');  // ✅ CLEAR ERROR MESSAGE
      } else {
        setError(result.message || 'Update failed');
      }
    } catch (err) {
      setError('Update failed after retries: ' + err.message);
    }
    setIsLoading(false);
  } else {
    try {
            const result = await callWithRetry('addSheetRow', targetTable, dataToSubmit, username);
      if (result.success) {
        setSuccessMessage('Record added successfully');
        setData(prev => ({
          ...prev,
          [targetTable]: [...prev[targetTable], result.data],
        }));
        setFormData({});
        setIsAdding(false);
        setFormErrors({});
        setError('');  // ✅ CLEAR ERROR MESSAGE
        if (targetTable === 'class_sections' || targetTable === 'class_mappings') {
          refreshData();
        }
      } else {
        setError(result.message || 'Add failed');
      }
    } catch (err) {
      setError('Add failed after retries: ' + err.message);
    }
    setIsLoading(false);
  }
};

      const handleEditClick = (index) => {
        setEditingIndex(index);
        setIsAdding(false);
        const item = filteredData[index];
        const newFormData = { ...item };
        if (table === 'users') {
          newFormData.allowedTabs = item.allowedTabs ? item.allowedTabs.split(',') : [];
          newFormData.AllowedDays = item.AllowedDays ? item.AllowedDays.split(',') : [];
        }
        if (table === 'teacher_assignments') {
          newFormData.Class_Section = item.Class_Section ? item.Class_Section.split(',') : [];
        }
                if (table === 'student_data') {
          newFormData.Date_of_Joining = parseDDMMMYYYYToDate(item.Date_of_Joining);
        }
        if (table === 'user_permissions') {
          Object.keys(newFormData).forEach(key => {
            if (key !== 'Username' && key !== 'REC_ID' && key !== '_rowNumber') {
              const v = newFormData[key];
              newFormData[key] = v === true || v === 'true' || v === 'TRUE';
            }
          });
        }
        setFormData(newFormData);
        setIsStdIdEditable(false);
      };

      const handleDeleteClick = (table, index, rowNumber) => {
        setDeleteParams({ table: table === 'class_sections' ? subTab : table, index, rowNumber });
        setShowDeleteConfirm(true);
      };

      const confirmDelete = async () => {
        try {
          await onDelete(deleteParams.table, deleteParams.rowNumber);
        } catch (err) {
          setError('Delete failed: ' + err.message);
        }
        setShowDeleteConfirm(false);
        setDeleteParams({ table: '', index: null, rowNumber: null });
      };

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value,
        }));
        setFormErrors(prev => ({ ...prev, [name]: '' }));
        if (name === 'Student_Class' && table === 'student_data') {
          setFormData(prev => ({ ...prev, Student_Section: '' }));
        }
        if (name === 'Allowed_Date' && table === 'previous_date_permissions') {
          setFormData(prev => ({ ...prev, Day: getDayOfWeek(value) }));
        }
      };

      const handleMultipleSelect = (e, name) => {
        const options = Array.from(e.target.selectedOptions).map(option => option.value);
        setFormData(prev => ({ ...prev, [name]: options }));
      };

      const renderFormFields = () => {
        const config = table === 'class_sections' ? tableConfigs[subTab] : tableConfigs[table];
        
        return config.fields.map((section, sectionIndex) => (
          <div key={sectionIndex} className="form-section">
            <div className="form-section-title">
              <i className="uil uil-folder"></i>
              {section.section}
            </div>
              <div className={`form-row ${section.fields.every(f => f.type === 'checkbox') ? 'checkbox-row' : ''}`}>
              {section.fields.map(field => (
                <div key={field.name} className={`form-field ${field.type === 'checkbox' ? 'checkbox' : ''}`}>
                  {field.type === 'select' ? (
                    <>
                      <select
                        name={field.name}
                        value={formData[field.name] || ''}
                        onChange={handleInputChange}
                        className="form-input"
                        id={field.name}
                        disabled={field.disabled}
                        required={field.required}
                      >
                        <option value="" disabled>{field.placeholder}</option>
                        {(field.name === 'Student_Section' ? classSectionMap[formData.Student_Class] || [] : field.options).map(option => (
                          <option key={option} value={option}>{option}</option>
                        ))}
                      </select>
                      <label htmlFor={field.name}>{field.name.replace('_', ' ')}</label>
                    </>
                  ) : field.type === 'select-multiple' ? (
                    <>
                      <select
                        multiple
                        name={field.name}
                        value={formData[field.name] || []}
                        onChange={e => handleMultipleSelect(e, field.name)}
                        className="form-input"
                        id={field.name}
                        required={field.required}
                      >
                        {field.options.map(option => (
                          <option key={option} value={option}>{option}</option>
                        ))}
                      </select>
                      <label htmlFor={field.name}>{field.name.replace('_', ' ')}</label>
                    </>
                  ) : field.type === 'checkbox' ? (
                    <>
                      <input
                        type="checkbox"
                        name={field.name}
                        checked={formData[field.name] || false}
                        onChange={handleInputChange}
                        id={field.name}
                      />
                      <label htmlFor={field.name}>{field.placeholder}</label>
                    </>
                  ) : (
                    <>
                      <input
                        type={field.type}
                        name={field.name}
                        value={formData[field.name] || ''}
                        onChange={handleInputChange}
                        placeholder={field.placeholder}
                        className="form-input"
                        id={field.name}
                        disabled={field.disabled}
                        required={field.required}
                      />
                      <label htmlFor={field.name}>{field.name.replace('_', ' ')}</label>
                    </>
                  )}
                  {formErrors[field.name] && (
                    <p className="form-error">{formErrors[field.name]}</p>
                  )}
                </div>
              ))}
            </div>
          </div>
        ));
      };

      return (
        <div className="card p-6">
          <div className="flex items-center mb-4">
            <i className={`uil uil-${table === 'users' ? 'users-alt' : table === 'user_permissions' ? 'lock' : table === 'class_sections' ? 'map' : table === 'previous_date_permissions' ? 'calendar-alt' : table === 'teacher_assignments' ? 'user-check' : 'graduation-cap'} text-2xl text-blue-500 mr-2`}></i>
            <h2 className="text-xl font-semibold">{table.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase())}</h2>
          </div>
          {table === 'class_sections' && (
            <div className="mb-4 flex space-x-2">
              <button
                onClick={() => setSubTab('class_sections')}
                className={`px-4 py-2 rounded-md ${subTab === 'class_sections' ? 'btn-primary' : 'btn-outline'}`}
              >
                Class Sections
              </button>
              <button
                onClick={() => setSubTab('class_mappings')}
                className={`px-4 py-2 rounded-md ${subTab === 'class_mappings' ? 'btn-primary' : 'btn-outline'}`}
              >
                Class Mappings
              </button>
            </div>
          )}
          {(isAdding || editingIndex !== null) && (
            <div className="form-container mb-6">
              <h3 className="text-lg font-semibold mb-4">{editingIndex !== null ? 'Edit' : 'Add'} {table === 'class_sections' ? subTab.replace('_', ' ') : table.replace('_', ' ')}</h3>
              <form onSubmit={table === 'student_data' ? handleStudentSubmit : handleSubmit}>
                {renderFormFields()}
                {formErrors.general && (
                  <p className={`${formErrors.general.includes('successfully') ? 'form-message' : 'form-error'}`}>{formErrors.general}</p>
                )}
                {message && (
                  <p className="form-message">{message}</p>
                )}
                <div className="form-actions">
                  <button
                    type="submit"
                    disabled={isLoading}
                    className={`btn-primary ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}
                  >
                    {isLoading ? (
                      <>
                        <i className="uil uil-spinner text-xl loading-spinner"></i>
                        Saving...
                      </>
                    ) : editingIndex !== null ? 'Update' : 'Add'}
                  </button>
                 {table === 'student_data' && editingIndex !== null && canAmendSIRN && (
  <button
    type="button"
    onClick={() => setIsStdIdEditable(!isStdIdEditable)}
    className="btn-outline"
  >
    {isStdIdEditable ? 'Lock SIRN' : 'Amend SIRN'}
  </button>
)}
                  <button
                    type="button"
                    onClick={clearForm}
                    className="btn-outline"
                  >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          )}
          {!isAdding && editingIndex === null && (
            <div className="flex flex-wrap gap-2 mb-6">
                            <button
                onClick={async () => {
                  setIsAdding(true);
                  const defaults = {};
                  const cfg = table === 'class_sections' ? tableConfigs[subTab] : tableConfigs[table];
                  if (cfg) {
                    cfg.fields.forEach(section => section.fields.forEach(f => {
                      if (f.type === 'checkbox') defaults[f.name] = false;
                    }));
                  }
                  if (table === 'student_data') {
                    const barcodeField = tableConfigs.student_data.fields
                      .flatMap(s => s.fields)
                      .find(f => f.name === 'Barcode_ID');
                    defaults.Barcode_ID = barcodeField ? barcodeField.placeholder : '';
                  }
                  setFormData(defaults);
                  setIsStdIdEditable(table === 'student_data');
                  if (table === 'student_data') {
                    try {
                      const reserveResult = await callWithRetry('getSheetData', 'Reserve_Codes', recId);
                      const unused = reserveResult.find(r => r.Status === 'Unused');
                      if (unused) setFormData(prev => ({ ...prev, Barcode_ID: unused.Barcode_ID }));
                    } catch (e) {
                      // Reserve_Codes sheet may not exist yet — keep the "auto-generated" placeholder text
                    }
                  }
                }}
                className="btn-primary"
              >
                Add New {table === 'class_sections' ? subTab.replace('_', ' ') : table.replace('_', ' ')}
              </button>
              <button
                onClick={() => refreshData()} 
                className="btn-secondary"
              >
                Refresh Data
              </button>
            </div>
          )}
          {isLoading ? (
            <p className="text-gray-500">Loading...</p>
          ) : filteredData.length === 0 ? (
            <p className="text-gray-500">No data available</p>
          ) : (
            <div className="table-container max-h-[600px]">
              <table className="min-w-full">
                <thead className="sticky-header">
                  <tr>
                    {(table === 'student_data'
                      ? [
                      { name: 'Unique_ID' },  // ← ADD THIS FIRST
                          { name: 'Std_ID' },
                          { name: 'Barcode_ID' },
                          { name: 'Student_Name' },
                          { name: 'Gender' },
                          { name: 'Date_of_Joining' },
                          { name: 'Student_Class' },
                          { name: 'Student_Section' },
                          { name: 'Status' },
                          { name: 'Inactive_Date' },
                          { name: 'Creation_Date' },
                          { name: 'Created_By' },
                          { name: 'Last_Modified_Date' },
                          { name: 'Last_Modified_By' },
                          { name: 'Active_Date' },
                          { name: 'QR_Printed' },
                          { name: 'REC_ID' },  // ← ADD THIS
                        ]
                      : (table === 'class_sections' ? tableConfigs[subTab].fields.flatMap(s => s.fields) : tableConfigs[table].fields.flatMap(s => s.fields))
                    ).map(field => (
                      <th key={field.name}>
                        {field.name.replace('_', ' ')}
                      </th>
                    ))}
                    <th>Actions</th>
                  </tr>
                </thead>
               <tbody>
  {filteredData
    .filter(item => item.Username !== 'superadmin')
    .map((item, index) => (
      <tr key={index}>
                      {(table === 'student_data'
                        ? [
                         { name: 'Unique_ID' },  // ← ADD THIS
                            { name: 'Std_ID' },
                            { name: 'Barcode_ID' },
                            { name: 'Student_Name' },
                            { name: 'Gender' },
                            { name: 'Date_of_Joining' },
                            { name: 'Student_Class' },
                            { name: 'Student_Section' },
                            { name: 'Status' },
                            { name: 'Inactive_Date' },
                            { name: 'Creation_Date' },
                            { name: 'Created_By' },
                            { name: 'Last_Modified_Date' },
                            { name: 'Last_Modified_By' },
                            { name: 'Active_Date' },
                            { name: 'QR_Printed' },
                            { name: 'REC_ID' },  // ← ADD THIS
                          ]
                        : (table === 'class_sections' ? tableConfigs[subTab].fields.flatMap(s => s.fields) : tableConfigs[table].fields.flatMap(s => s.fields))
                      ).map(field => (
                                                <td key={field.name}>
                          {table === 'user_permissions' && !['Username', 'REC_ID'].includes(field.name)
                            ? ((item[field.name] === true || item[field.name] === 'true' || item[field.name] === 'TRUE') ? 'Yes' : 'No')
                            : (item[field.name] || '')}
                        </td>
                        
                      ))}
                      <td>
                        <button
                          onClick={() => handleEditClick(index)}
                          className="text-blue-500 hover:underline mr-4"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => {
                            if (table === 'student_data' && !canDeleteStudent) {
                              setError('You do not have permission to delete student records');
                              return;
                            }
                            handleDeleteClick(table, index, item._rowNumber);
                          }}
                          className={`text-red-500 hover:underline ${table === 'student_data' && !canDeleteStudent ? 'opacity-50 cursor-not-allowed' : ''}`}
                          disabled={table === 'student_data' && !canDeleteStudent}
                        >
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {showDeleteConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
              <div className="card p-6 max-w-sm w-full">
                <h3 className="text-lg font-semibold mb-4">Confirm Delete</h3>
                <p className="text-gray-600 dark:text-gray-400 mb-4">Are you sure you want to delete this record?</p>
                <div className="flex space-x-4">
                  <button
                    onClick={confirmDelete}
                    className="btn-primary"
                  >
                    Yes, Delete
                  </button>
                  <button
                    onClick={() => setShowDeleteConfirm(false)}
                    className="btn-outline"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
