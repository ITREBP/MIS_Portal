  <script>
    /* v6.1: apply the saved theme before React mounts (no flash of green). */
    (function () {
      try {
        var t = localStorage.getItem('attendance-theme');
        if (t !== 'green' && t !== 'blue' && t !== 'natural') t = 'green';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'green');
      }
    })();
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --primary-color: #16a34a;
      --primary-light: #dcfce7;
      --primary-dark: #15803d;
      --primary-ring: rgba(22, 163, 74, 0.15);
      --secondary-color: #64748b;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --error-color: #ef4444;
      --panel-color: #ffffff;
      --text-color: #1f2937;
      --text-light: #6b7280;
      --border-color: #e5e7eb;
      --hover-color: #f8fafc;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --transition: all 0.3s ease;
    }

    body.dark {
      --primary-color: #4ade80;
      --primary-light: #14532d;
      --primary-dark: #86efac;
      --secondary-color: #9ca3af;
      --panel-color: #1f2937;
      --text-color: #f9fafb;
      --text-light: #d1d5db;
      --border-color: #374151;
      --hover-color: #374151;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
    }

    /* v6.1 themes: data-theme on <html> picks the primary accent palette.
       Green is the default (same values as v6). Dark-mode variants keep
       working with every theme; theme = accent, dark mode = surface. */
    [data-theme="blue"] {
      --primary-color: #2563eb;
      --primary-light: #dbeafe;
      --primary-dark: #1d4ed8;
      --primary-ring: rgba(37, 99, 235, 0.15);
    }

    [data-theme="natural"] {
      --primary-color: #c2410c;
      --primary-light: #ffedd5;
      --primary-dark: #9a3412;
      --primary-ring: rgba(194, 65, 12, 0.15);
    }

    body.dark[data-theme="blue"] {
      --primary-color: #60a5fa;
      --primary-light: #1e3a8a;
      --primary-dark: #93c5fd;
      --primary-ring: rgba(96, 165, 250, 0.20);
    }

    body.dark[data-theme="natural"] {
      --primary-color: #fb923c;
      --primary-light: #7c2d12;
      --primary-dark: #fdba74;
      --primary-ring: rgba(251, 146, 60, 0.20);
    }

    /* v6.1 theme-driven accent utilities (primary accent only). */
    .bg-accent { background: var(--primary-color); }
    .bg-accent-light { background: var(--primary-light); }
    .text-accent { color: var(--primary-color); }
    .text-accent-dark { color: var(--primary-dark); }
    .link-accent { color: var(--primary-color); }
    .link-accent:hover { color: var(--primary-dark); text-decoration: underline; }
    .accent-check { accent-color: var(--primary-color); }

    body {
      background-color: #f8fafc;
      color: var(--text-color);
      transition: var(--transition);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body.dark {
      background-color: #111827;
    }

    html.dark { background-color: #111827; }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--panel-color);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 12px;
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    .slide-in {
      animation: slideIn 0.5s ease-out;
    }

    .loading-spinner {
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      background: var(--panel-color);
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .card {
      background: var(--panel-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      border: 1px solid var(--border-color);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
      font-weight: 500;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--secondary-color);
      color: white;
      border-radius: var(--radius-md);

      transition: var(--transition);

    .btn-outline {

      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
    }

    .btn-outline:hover {

    .form-container {

      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .form-field {
      margin-bottom: 1.25rem;
    }

    /* v6: labels sit ABOVE their control (floating-label pattern removed). */
    .form-field > label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-color);
      margin-bottom: 0.375rem;
    }

    /* Required fields get a red asterisk after the label. */
    .form-field:not(.checkbox):has(input[required], select[required], textarea[required]) > label::after {
      content: ' *';
      color: var(--error-color);
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--panel-color);
      color: var(--text-color);
      font-size: 0.875rem;
      transition: var(--transition);
    }

    .form-field input::placeholder {
      color: var(--text-light);

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {

      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .form-field select[multiple] {
      padding: 0.5rem;
      height: 100px;

    .form-field.checkbox {

      align-items: center;
      gap: 0.5rem;
    }

    .form-error {

    .form-message {

    .nav-item {

    }

    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);

    }

    .table-container table {

    .table-container th {

    }

    .table-container td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.875rem;
    }

    .table-container tr:hover {

    }

    .search-box {

    }

    .search-box input {

    .badge-warning {

    .badge-error {

    }

    }

    body.dark .badge-success {

      color: #a7f3d0;
    }

    body.dark .badge-warning {
      background: #78350f;
      color: #fcd34d;
    }

    body.dark .badge-error {
      background: #7f1d1d;
      color: #fca5a5;
    }

    body.dark .badge-info {

    }

    .sidebar {

      border-right: 1px solid var(--border-color);

      position: fixed;
      top: 0;
      left: 0;
      transition: var(--transition);
      z-index: 20;
      overflow-y: auto;
    }

    .main-content {
      transition: var(--transition);
      min-height: 100vh;
    }

    .notification {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      animation: fadeIn 0.3s ease-in;
    }

    .notification.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .notification.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;

    body.dark .notification.error {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #991b1b;
    }

    body.dark .notification.success {
      background: #166534;
      color: #bbf7d0;
      border: 1px solid #22c55e;

    .nav-section {
      margin-bottom: 1rem;
    }

    .nav-section-title {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-light);

    .form-section-title {

      font-weight: 600;
      margin-bottom: 1rem;

    .form-row {

    /* A lone field in a row spans both columns instead of sitting half-width. */

      grid-column: 1 / -1;

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;

        .form-row.checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.75rem;
    }

    .form-row.checkbox-row .form-field {
      margin-bottom: 0;

    .form-field.checkbox label {

      padding: 0;
      margin-bottom: 0;
      pointer-events: auto;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-color);

    /* Action buttons stick to the bottom of the viewport on long forms. */

      margin-top: 1.5rem;

    .user-card {

    .user-avatar {

    .permission-badge {

      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--primary-light);
      color: var(--primary-color);

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }

    .tab:hover {

    .tab.active {

    .sub-nav {

    .sub-nav-item {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      color: var(--text-color);
      transition: var(--transition);
      text-decoration: none;
      cursor: pointer;

      margin-bottom: 0.25rem;
    }

    .sub-nav-item:hover {
      background: var(--hover-color);

    .sub-nav-item.active {
      background: var(--primary-light);
      color: var(--primary-color);

    .report-section {
      background: var(--panel-color);
      border-radius: var(--radius-lg);

      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
    }

    .report-section h3 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-color);
    }
    /* ---- v6 layout revamp additions ---- */

    /* Mobile drawer: sidebar slides off-canvas; backdrop dims the page. */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 15;
    }

    @media (max-width: 767px) {
      .sidebar {
        transform: translateX(-105%);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.w-64 {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0 !important;
      }
      .form-container {
        padding: 1rem;
      }
    }

    /* Sticky first column (key column) on wide tables; header corner stays on top.
       Only the first header row's corner cell sticks (tables with a 2-row header
       keep their month sub-columns scrolling). */
    .table-container thead tr:first-child th:first-child {
      position: sticky;
      left: 0;
      z-index: 12;
    }

    .table-container tbody td:first-child {
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--panel-color);
      box-shadow: 1px 0 0 var(--border-color);
    }

    .table-container tbody tr:hover td:first-child {
      background: var(--hover-color);
    }

    /* Group/total rows carry their own row tint; keep it on the sticky cell too. */
    .table-container tbody tr.bg-gray-50 td:first-child {
      background: #f9fafb;
    }

  </style>
</head>
<body class="font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const MC_CAT_FIELD = {
  Category: 'Category', Hours: 'Category',
  Old_Category: 'Old_Category', Old_Hours: 'Old_Category',
  New_Category: 'New_Category', New_Hours: 'New_Category'
};
function mcCell(row, field) {
  const cf = MC_CAT_FIELD[field], s = cf ? String(row[cf] || '') : '';
  if (s.indexOf(' + ') === -1) return row[field];
  const items = [];
  for (const part of s.split(' + ')) {
    const m = part.trim().match(/^(.+) \((\d+(?:\.\d+)?)\)$/);
    if (!m) return row[field];
    items.push({ name: m[1], hours: Number(m[2]) });
  }

  // 👇 CHANGE THIS LINE BACK TO FORMATTING NAMES AND HOURS 👇
  return items.map(i => `${i.name} (${i.hours})`).join(' + ');
}

    function WelcomePage({ teacherName, onContinue }) {
      return (
        <div className="p-6 flex items-center justify-center min-h-screen">
          <div className="card p-8 text-center fade-in max-w-lg w-full">
            <div className="w-16 h-16 bg-accent-light rounded-full flex items-center justify-center mx-auto mb-4">
              <i className="uil uil-check-circle text-3xl text-accent"></i>
            </div>
            <h1 className="text-2xl font-bold mb-2">Welcome, {teacherName}!</h1>
            <p className="text-gray-600 dark:text-gray-400 mb-6">You have successfully logged into the MIS Admin Dashboard.</p>
            <button
              onClick={onContinue}
              className="btn-primary w-full"
            >
              Continue to Dashboard
            </button>
          </div>
        </div>
      );
    }

    function runGAS(method, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [method](...args);
      });
    }

    async function callWithRetry(method, ...args) {
      const maxRetries = 5;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const result = await runGAS(method, ...args);
          return result;
        } catch (err) {
          if (attempt === maxRetries) {
            throw err;
          }
          await new Promise(resolve => setTimeout(resolve, 2000 * attempt));
        }
      }
    }

// ---------- Shared helpers for AttendanceReportsPage ----------

// Parse any of: Date object, ISO string, or "dd-MMM-yyyy" string.
function parseAnyDate(d) {
  if (!d) return null;
  if (d instanceof Date) return isNaN(d) ? null : d;
  if (typeof d === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(d)) {
    const [day, monStr, year] = d.split('-');
    const m = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
    return new Date(parseInt(year), m[monStr], parseInt(day));
  }
  const dt = new Date(d);
  return isNaN(dt) ? null : dt;
}

// Normalise any date form to yyyy-MM-dd, so the day-category lookup
// matches whether the sheet gave a Date or a "2025-Nov-03" string.
function dayKey(d) {
  const dt = parseAnyDate(d);
  if (!dt) return String(d || '');
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}

// ---------- Shared helpers for Terms / Class_Terms (v4) ----------
// Same rules as the GS helpers: Terms holds names only, dates live in Class_Terms.
// A bare token ('I') covers every section of that class; 'III-B' covers only III-B.
// First matching ACTIVE row wins; reports filter by date range, never by Term_ID stamp.
// When no term is picked, these helpers are not used and reports behave exactly as before.
function termExpandClassCell_(cell) {
  let str = String(cell || '').trim();
  if (!str) return [];
  if (str.charAt(0) === '{' && str.charAt(str.length - 1) === '}') str = str.slice(1, -1);
  return str.split(',').map(t => t.trim()).filter(Boolean);
}
function termBaseClassOf_(cs) {
  const str = String(cs || '').trim();
  const i = str.indexOf('-');
  return (i === -1 ? str : str.slice(0, i)).trim();
}
function termTokenMatches_(tok, cs) {
  const t = String(tok || '').trim();
  const c = String(cs || '').trim();
  if (!t || !c) return false;
  if (t.indexOf('-') === -1) return termBaseClassOf_(c).toLowerCase() === t.toLowerCase();
  return t.toLowerCase() === c.toLowerCase();
}
function termCellMatches_(cell, cs) {
  return termExpandClassCell_(cell).some(tok => termTokenMatches_(tok, cs));
}
function termIsActive_(v) {
  return String(v == null ? '' : v).trim().toLowerCase() === 'true';
}
function termParseDate_(v) {
  const d = parseAnyDate(v);
  if (!d) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function termDateKey_(d) {
  if (!d) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// First ACTIVE Class_Terms row for this class-section (+ optional termId). {start, end, termId} ('yyyy-MM-dd') or null.
function termRangeForClass_(classTerms, classSection, termId) {
  const wantTerm = String(termId || '').trim().toLowerCase();
  const rows = classTerms || [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!termIsActive_(r.Is_Active)) continue;
    if (wantTerm && String(r.Term_ID || '').trim().toLowerCase() !== wantTerm) continue;
    if (!termCellMatches_(String(r.Class_Section || ''), classSection)) continue;
    const s = termParseDate_(r.Start_Date);
    const e = termParseDate_(r.End_Date);
    if (!s || !e) continue;
    return { start: termDateKey_(s), end: termDateKey_(e), termId: String(r.Term_ID || '').trim() };
  }
  return null;
}
// Union span (earliest start, latest end) of ACTIVE rows of one term covering one bare class.
function termSpanForClass_(classTerms, className, termId) {
  const wantTerm = String(termId || '').trim().toLowerCase();
  const wantClass = String(className || '').trim().toLowerCase();
  let sMin = null, eMax = null;
  (classTerms || []).forEach(r => {
    if (!termIsActive_(r.Is_Active)) return;
    if (wantTerm && String(r.Term_ID || '').trim().toLowerCase() !== wantTerm) return;
    const covers = termExpandClassCell_(r.Class_Section).some(tok => termBaseClassOf_(tok).toLowerCase() === wantClass);
    if (!covers) return;
    const s = termParseDate_(r.Start_Date);
    const e = termParseDate_(r.End_Date);
    if (!s || !e) return;
    if (!sMin || s < sMin) sMin = s;
    if (!eMax || e > eMax) eMax = e;
  });
  return (sMin && eMax) ? { start: termDateKey_(sMin), end: termDateKey_(eMax) } : null;
}
// Union span of ALL ACTIVE rows of one term (any class), or null.
function termSpan_(classTerms, termId) {
  const wantTerm = String(termId || '').trim().toLowerCase();
  let sMin = null, eMax = null;
  (classTerms || []).forEach(r => {
    if (!termIsActive_(r.Is_Active)) return;
    if (wantTerm && String(r.Term_ID || '').trim().toLowerCase() !== wantTerm) return;
    const s = termParseDate_(r.Start_Date);
    const e = termParseDate_(r.End_Date);
    if (!s || !e) return;
    if (!sMin || s < sMin) sMin = s;
    if (!eMax || e > eMax) eMax = e;
  });
  return (sMin && eMax) ? { start: termDateKey_(sMin), end: termDateKey_(eMax) } : null;
}
// Base classes covered by ACTIVE rows of one term, in first-seen order.
function termClasses_(classTerms, termId) {
  const wantTerm = String(termId || '').trim().toLowerCase();
  const out = [];
  (classTerms || []).forEach(r => {
    if (!termIsActive_(r.Is_Active)) return;
    if (wantTerm && String(r.Term_ID || '').trim().toLowerCase() !== wantTerm) return;
    termExpandClassCell_(r.Class_Section).forEach(tok => {
      const b = termBaseClassOf_(tok);
      if (b && out.indexOf(b) === -1) out.push(b);
    });
  });
  return out;
}
// Term picker options: active terms first, then inactive. Values are Term_IDs.
function termPickerOptions_(terms) {
  const rows = (terms || []).filter(t => t && String(t.Term_ID || '').trim());
  const act = rows.filter(t => termIsActive_(t.Is_Active));
  const inact = rows.filter(t => !termIsActive_(t.Is_Active));
  return act.concat(inact);
}


// Is the student enrolled on `targetDate`? (inclusive of both dates)
// Convention: Inactive_Date = first day the student is NOT active.
function isEnrolledOn(targetDate, fromDateStr, inactiveDateStr) {
  const target = parseAnyDate(targetDate);
  if (!target) return false;
  const doj      = parseAnyDate(fromDateStr);
  const inactive = parseAnyDate(inactiveDateStr);
  const joinedOK  = !doj      || doj <= target;
  const notLeftOK = !inactive || inactive > target;
  return joinedOK && notLeftOK;
}

// Is the student enrolled at ANY POINT during [monthStart, monthEnd]?
function isEnrolledInMonth(monthStart, monthEnd, fromDateStr, inactiveDateStr) {
  const doj      = parseAnyDate(fromDateStr);
  const inactive = parseAnyDate(inactiveDateStr);
  const joinedByMonthEnd  = !doj      || doj <= monthEnd;
  const notLeftBeforeStart = !inactive || inactive >= monthStart;
  return joinedByMonthEnd && notLeftBeforeStart;
}

// ---------- Shared helpers for Edit Hours ----------
function parseDayCategories(dayCatStr) {
  const s = String(dayCatStr || '');
  if (s.indexOf(' + ') === -1) return [{ name: s.trim(), hours: null }];
  const items = [];
  for (const part of s.split(' + ')) {
    const m = part.trim().match(/^(.+) \((\d+(?:\.\d+)?)\)$/);
    if (m) items.push({ name: m[1], hours: Number(m[2]) });
  }
  return items.length ? items : [{ name: s.trim(), hours: null }];
}

function parseStudentCategoryMap(catStr) {
  const s = String(catStr || '');
  if (s.indexOf(' + ') === -1) {
    // Single category – try "Name (hours)" format
    const m = s.trim().match(/^(.+) \((\d+(?:\.\d+)?)\)$/);
    if (m) return { [m[1].trim()]: Number(m[2]) };
    return {};      // Plain "Curriculum" with no hours → no map
  }
  const out = {};
  for (const part of s.split(' + ')) {
    const m = part.trim().match(/^(.+) \((\d+(?:\.\d+)?)\)$/);
    if (m) out[m[1]] = Number(m[2]);
  }
  return out;
}

function formatCategoryString(items) {
  if (items.length === 1) return items[0].name;
  return items.map(i => `${i.name} (${Number(i.hours) || 0})`).join(' + ');
}

          if (id) {
            map[id] = {

      }, [data.student_data]);


      // Term filter (v4): when a term is picked, only classes in that term for this REC.
      const termClassList = formData.termId ? termClasses_(data.class_terms || [], formData.termId) : null;
      const uniqueClasses = [...new Set(data.student_attendance.map(item => item.Student_Class).filter(Boolean))].filter(cls => !termClassList || termClassList.includes(cls));
      // Term date range for the picked class/section (per-class range, not one global range).
      const reportTermRange = (() => {
        if (!formData.termId) return null;
        const cs = formData.studentClass && formData.studentSection ? formData.studentClass + '-' + formData.studentSection : (formData.studentClass || '');
        if (cs && formData.studentSection) return termRangeForClass_(data.class_terms || [], cs, formData.termId);
        if (cs) return termSpanForClass_(data.class_terms || [], cs, formData.termId);
        return termSpan_(data.class_terms || [], formData.termId);
      })();
      // Shared term filter for search + download results: each row must fall inside
      // its own class-section's term range. Rows with no term row for the class are out.
      const applyTermFilter = (rows) => {
        if (!formData.termId) return rows;
        return rows.filter(item => {
          const cs = (item.Class_Section || ((item.Student_Class || '') + '-' + (item.Student_Section || ''))).trim();
          const r = termRangeForClass_(data.class_terms || [], cs || item.Student_Class, formData.termId);
          if (!r) return false;
          const k = dayKey(item.Date);
          return k >= r.start && k <= r.end;

   function StudentReports({ data, isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, classes, classSectionMap, searchQuery, refreshData }) {

  const generateReport = (e, skipLoading = false) => {
    if (e) e.preventDefault();

    // Make sure we have data to filter
    if (!data.student_data || data.student_data.length === 0) {
      setReportData([]);

      return;
    }
    
    // Start with all student data
    let filtered = [...data.student_data];
    
    // Only apply filters if they have values (not empty strings)
    if (formData.studentClass && formData.studentClass.trim() !== '') {
      filtered = filtered.filter(student =>

      );
    }
    
    if (formData.studentSection && formData.studentSection.trim() !== '') {
      filtered = filtered.filter(student =>

      );
    }
    
    if (formData.status && formData.status.trim() !== '') {
      filtered = filtered.filter(student => 
        student.Status && student.Status.toString() === formData.status.toString()
      );
    }
    
    if (formData.studentId && formData.studentId.trim() !== '') {
      filtered = filtered.filter(student => 
        student.Std_ID && student.Std_ID.toString().includes(formData.studentId.toString())
      );
    }
    
    // Handle year filtering - check BOTH Creation_Date and Inactive_Date based on status
    if (formData.year && formData.year.toString().trim() !== '') {
      filtered = filtered.filter(student => {
        const selectedYear = parseInt(formData.year);
        
        // If status filter is specifically set to 'Inactive', only check Inactive_Date
        if (formData.status === 'Inactive') {
          if (!student.Inactive_Date) return false;
          
          try {
            const dateStr = student.Inactive_Date.toString();
            const dateParts = dateStr.split('-');
            
            if (dateParts.length === 3) {
              const yearStr = dateParts[2];
              const studentYear = parseInt(yearStr);
              return studentYear === selectedYear;
            }
            return false;
          } catch (e) {
            return false;

        // If no status filter or status is 'All', check both dates

                if (studentYear === selectedYear) matchesYear = true;

          // Check Inactive_Date (if not already matched)

                const yearStr = dateParts[2];
                const studentYear = parseInt(yearStr);

              }
            } catch (e) {}
          }
          
          return matchesMonth;
        }

    }
    
    setReportData(filtered);
    if (!skipLoading) setIsLoading(false);
  };

            const dateParts = student.Creation_Date.toString().split('-');
            if (dateParts.length === 3 && monthMap[dateParts[1]] === selectedMonth) matchesMonth = true;
          } catch (e) {}
        }
        if (!matchesMonth && student.Inactive_Date) {
          try {
            const dateParts = student.Inactive_Date.toString().split('-');
            if (dateParts.length === 3 && monthMap[dateParts[1]] === selectedMonth) matchesMonth = true;
          } catch (e) {}
        }
        return matchesMonth;
      }
    });
  }

  if (filtered.length === 0) {
    setError('No data to download');
    return;
  }

  const headers = STUDENT_COLUMNS;
  let csv = headers.join(',') + '\n';

  filtered.forEach(student => {
    const row = headers.map(header => {
      const value = student[header] || '';
      return `"${value.toString().replace(/"/g, '""')}"`;
    });
    csv += row.join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `student_class_wise_report_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.URL.revokeObjectURL(url);
  setSuccessMessage(`Report downloaded successfully (${filtered.length} students)`);
};

function QRManagement({ data, isLoading, setIsLoading, setError, setSuccessMessage, username, userPermissions, refreshData }) {
  const [selectedStudents, setSelectedStudents] = useState([]);
  const [selectAll, setSelectAll] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [viewFilter, setViewFilter] = useState('unprinted'); // 'unprinted' | 'printed' | 'all'
    const [searchFilter, setSearchFilter] = useState('');      // ← ADD THIS LINE

  const displayedStudents = data.student_data
    .filter(s => {
      if (viewFilter === 'unprinted') return s.QR_Printed !== 'Yes';
      if (viewFilter === 'printed') return s.QR_Printed === 'Yes';
      return true;
    })
    .filter(s => {
      if (!searchFilter.trim()) return true;
      const q = searchFilter.trim().toLowerCase();
      const sid = String(s.Std_ID || '').toLowerCase();
      const name = String(s.Student_Name || '').toLowerCase();
      const bc = String(s.Barcode_ID || '').toLowerCase();
      return sid.includes(q) || name.includes(q) || bc.includes(q);
    });

  const handleRefresh = async () => {
    setIsLoading(true);
    await refreshData();
    setIsLoading(false);
  };

  const handleSelectAll = () => {
    if (selectAll) {
      setSelectedStudents([]);
    } else {
      setSelectedStudents(displayedStudents.map(s => s.Std_ID));
    }
    setSelectAll(!selectAll);
  };

  const handleSelectStudent = (stdId) => {
    if (selectedStudents.includes(stdId)) {
      setSelectedStudents(selectedStudents.filter(id => id !== stdId));
      setSelectAll(false);
    } else {
      setSelectedStudents([...selectedStudents, stdId]);
    }
  };

  const handlePrintQR = async () => {
    if (selectedStudents.length === 0) {
      setError('Please select at least one student');
      return;
    }

    setIsGenerating(true);
    try {
      const studentsToPrint = displayedStudents.filter(s =>
        selectedStudents.includes(s.Std_ID)
      );

      const result = await callWithRetry('generateQRCodePDF', studentsToPrint);

      const printWindow = window.open('', '_blank');
      printWindow.document.write(result);
      printWindow.document.close();

      await callWithRetry('markStudentsAsPrinted', selectedStudents, username);

      setSuccessMessage(`QR codes generated for ${selectedStudents.length} students`);
      setSelectedStudents([]);
      setSelectAll(false);
      await refreshData(); // reload data.student_data so QR_Printed reflects the change

    } catch (err) {
      setError('Failed to generate QR codes: ' + err.message);
    }
    setIsGenerating(false);
  };

  const handlePrintAll = async () => {
  if (displayedStudents.length === 0) {
    setError('No students in this view');
    return;
  }
  const allIds = displayedStudents.map(s => s.Std_ID);
  setSelectedStudents(allIds);

  // Inline the print logic so we don't depend on stale `selectedStudents`
  setIsGenerating(true);
  try {
    const studentsToPrint = displayedStudents.filter(s =>
      allIds.includes(s.Std_ID)
    );
    const result = await callWithRetry('generateQRCodePDF', studentsToPrint);
    const printWindow = window.open('', '_blank');
    printWindow.document.write(result);
    printWindow.document.close();
    await callWithRetry('markStudentsAsPrinted', allIds, username);
    setSuccessMessage(`QR codes generated for ${allIds.length} students`);
    setSelectedStudents([]);
    setSelectAll(false);
    await refreshData();
  } catch (err) {
    setError('Failed to generate QR codes: ' + err.message);
  }
  setIsGenerating(false);
};

  return (
    <div className="card p-6">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center">
          <i className="uil uil-qrcode-scan text-2xl text-accent mr-2"></i>
          <h2 className="text-xl font-semibold">QR Code Management</h2>
        </div>
        <div className="flex gap-2">
          <button

            className="btn-outline"

            Refresh
          </button>

      </div>

      </div>

      <div className="flex gap-2 mb-4">
        {['unprinted', 'printed', 'all'].map(f => (
          <button
            key={f}
            onClick={() => { setViewFilter(f); setSelectedStudents([]); setSelectAll(false); }}

          >
            {f.charAt(0).toUpperCase() + f.slice(1)}

{/* 🆕 Search box — filter by SIRN / Name / Barcode */}
      <div className="mb-4 flex items-center gap-3">
        <div className="search-box flex-1" style={{ maxWidth: '400px' }}>
          <i className="uil uil-search"></i>
          <input

          />
        </div>
        {searchFilter && (

            <i className="uil uil-times"></i> Clear

      <div className="flex gap-4 mb-6">
        <button

        >
          {isGenerating ? (
            <>
              <i className="uil uil-spinner text-xl loading-spinner"></i>

            </>

            <>

        <button

      </div>

      {isLoading ? (
        <p className="text-gray-500">Loading students...</p>
      ) : displayedStudents.length === 0 ? (
        <div className="text-center p-8 bg-gray-50 dark:bg-gray-800 rounded-lg">
          <i className="uil uil-check-circle text-5xl text-green-500 mb-4"></i>
          <p className="text-gray-600 dark:text-gray-400">
            {viewFilter === 'unprinted' ? 'All QR codes have been printed!' : 'No students found for this view.'}
          </p>
        </div>
      ) : (

            </label>
<span className="ml-4 text-sm text-gray-500">
  {selectedStudents.length} of {displayedStudents.length} selected
  {searchFilter && ` (filtered from ${data.student_data.length})`}
</span>
          </div>

          <div className="table-container max-h-[500px]">
            <table className="min-w-full">
              <thead className="sticky-header">
                <tr>
                  <th className="w-12">Select</th>
                  <th>SIRN</th>
                  <th>Barcode ID</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Section</th>
                  <th>Printed</th>
                </tr>
              </thead>
              <tbody>
                {displayedStudents.map((student, index) => (
                  <tr key={index} className="hover:bg-gray-50 dark:hover:bg-gray-700">

                      <input

                        checked={selectedStudents.includes(student.Std_ID)}

          </div>

}

  html += '</tr>';

      // 2. If only one group, do the normal single PNG download
         if (isSingle) {

           for (const key of groupKeys) {

    // ---------- ACCESS Hours Report (v5) ----------
    // Mirrors Monthly_Quarterly_Report.xlsx: per-student attended days, working days
    // and Present-only hours per month, quarter-to-date / monthly / yearly.
    // P0 = 0h, P1 = 0 < h < 2.5m, P2 = 2.5m <= h < 6.25m, P3 = h >= 6.25m,
    // Required Hours = 6.25m, where m = ENROLLED months for that child
    // (later of term start / Date of Joining, to the report month, capped at
// Inactive_Date). No grid labels. No BH/BI/BJ current-month columns,
    // no ACCESS-CM, no Contact columns, no DREC.
    function AccessHoursReport({ data, isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, classes, classSectionMap, searchQuery, username }) {
      const [selectedTerm, setSelectedTerm] = useState('');
      const [periodType, setPeriodType] = useState('monthly');
      const [selectedMonths, setSelectedMonths] = useState([]);
      const [viewMode, setViewMode] = useState('details');
      const [trendMode, setTrendMode] = useState('student');
      const [selectedQuarter, setSelectedQuarter] = useState('Q1');
      const [selectedClass, setSelectedClass] = useState('');
      const [reportRows, setReportRows] = useState([]);
      const [reportMeta, setReportMeta] = useState(null);
      const [generated, setGenerated] = useState(false);

      const norm = (v) => (v === undefined || v === null) ? '' : String(v).trim();
      const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const ACCESS_CLASS_ORDER = ['IBT', 'NUR', 'KGI', 'KGII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'HRE'];
      const SECTION_GROUPS = [
        { name: 'Pre-Primary', classes: ['IBT', 'NUR', 'KGI', 'KGII'] },
        { name: 'Lower Primary', classes: ['I', 'II', 'III'] },
        { name: 'Upper Primary', classes: ['IV', 'V', 'VI'] },
        { name: 'Secondary', classes: ['VII', 'VIII', 'IX', 'X', 'XI', 'HRE'] },
      ];
      const QUARTERS = { Q1: { month: 11, yearOff: 0 }, Q2: { month: 2, yearOff: 1 }, Q3: { month: 5, yearOff: 1 }, Q4: { month: 8, yearOff: 1 } };

      const monthKeyOf = (y, m) => y + '-' + String(m).padStart(2, '0');
      const monthLabelShort = (key) => {
        const parts = String(key || '').split('-');
        const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
        if (!y || !m) return String(key || '');
        return MONTH_NAMES[m - 1] + ' ' + String(y).slice(2);
      };
      const monthLabelLong = (key) => {
        const parts = String(key || '').split('-');
        const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
        if (!y || !m) return String(key || '');
        return MONTH_LONG[m - 1] + ' ' + y;
      };
      const monthsInRange = (startKey, endKey) => {
        const out = [];
        const sp = String(startKey || '').split('-');
        let y = parseInt(sp[0], 10), m = parseInt(sp[1], 10);
        const ep = String(endKey || '').split('-');
        const ey = parseInt(ep[0], 10), em = parseInt(ep[1], 10);
        if (!y || !m || !ey || !em) return out;
        while (y < ey || (y === ey && m <= em)) {
          out.push(monthKeyOf(y, m));
          m += 1; if (m > 12) { m = 1; y += 1; }
        }
        return out;
      };
      const monthStartDate = (key) => { const p = String(key).split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1); };
      const monthEndDate = (key) => { const p = String(key).split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0); };
      const sectionTagOf = (cls) => {
        const c = String(cls || '').trim();
        const g = SECTION_GROUPS.find(gr => gr.classes.indexOf(c) !== -1);
        return g ? g.name : '';
      };

      // ACTIVE Class_Terms rows of the picked term (data.class_terms is already REC-filtered).
      const activeTermRows = selectedTerm
        ? (data.class_terms || []).filter(r => termIsActive_(r.Is_Active) && norm(r.Term_ID).toLowerCase() === norm(selectedTerm).toLowerCase())
        : [];
      const termStartYear = () => {
        const found = String(selectedTerm || '').match(/(\d{4})/);
        if (found) return parseInt(found[1], 10);
        const starts = activeTermRows.map(r => termParseDate_(r.Start_Date)).filter(Boolean);
        if (starts.length) return Math.min.apply(null, starts.map(d => d.getFullYear()));
        return new Date().getFullYear();
      };
      const periodEndKey = () => {
        if (periodType === 'monthly') return selectedMonths.length ? selectedMonths.slice().sort().pop() : '';
        const sy = termStartYear();
        if (periodType === 'quarterly') {
          const q = QUARTERS[selectedQuarter] || QUARTERS.Q1;
          return monthKeyOf(sy + q.yearOff, q.month);
        }
        // Yearly: latest End_Date among the term's Class_Terms rows (fallback Aug of start year + 1).
        const ends = activeTermRows.map(r => termParseDate_(r.End_Date)).filter(Boolean);
        if (ends.length) {
          const mx = new Date(Math.max.apply(null, ends.map(d => d.getTime())));
          return monthKeyOf(mx.getFullYear(), mx.getMonth() + 1);
        }
        return monthKeyOf(sy + 1, 8);
      };
      const reportStartKey = () => {
        const starts = activeTermRows.map(r => termParseDate_(r.Start_Date)).filter(Boolean);
        if (!starts.length) return '';
        const mn = new Date(Math.min.apply(null, starts.map(d => d.getTime())));
        return monthKeyOf(mn.getFullYear(), mn.getMonth() + 1);
      };
      const termSpan = selectedTerm ? termSpan_(data.class_terms || [], selectedTerm) : null;
      const termMonthOptions = termSpan
        ? monthsInRange(
            monthKeyOf(termParseDate_(termSpan.start).getFullYear(), termParseDate_(termSpan.start).getMonth() + 1),
            monthKeyOf(termParseDate_(termSpan.end).getFullYear(), termParseDate_(termSpan.end).getMonth() + 1)
          )
        : [];
      const termClassList = selectedTerm ? termClasses_(data.class_terms || [], selectedTerm) : null;
      const inMappings = (classes || []).filter(c => !termClassList || termClassList.indexOf(c) !== -1);
      const visibleClasses = inMappings.length ? inMappings : (termClassList || []);
      const quarterOptions = ['Q1', 'Q2', 'Q3', 'Q4'].map(q => {
        const def = QUARTERS[q];
        return { value: q, label: q + ' — ends ' + monthLabelLong(monthKeyOf(termStartYear() + def.yearOff, def.month)) };
      });
      const periodLabel = () => {
        if (!reportMeta) return '';
        if (periodType === 'monthly') return (reportMeta.months || []).map(monthLabelLong).join(', ');
        if (periodType === 'quarterly') return selectedQuarter + ' (QTD) — ' + monthLabelShort(reportMeta.startKey) + ' to ' + monthLabelLong(reportMeta.endKey);
        return 'Full year — ' + monthLabelShort(reportMeta.startKey) + ' to ' + monthLabelLong(reportMeta.endKey);
      };
      const resetResults = () => { setReportRows([]); setReportMeta(null); setGenerated(false); };

      const buildReportRows = (attRows, setupRows, months, endKey, displayMonths) => {
        let students = (data.student_data || []).slice();
        if (selectedClass) students = students.filter(s => norm(s.Student_Class) === norm(selectedClass));
        const studentById = {};
        students.forEach(s => { studentById[norm(s.Std_ID)] = s; });

        // Attendance rows, REC-scoped by Std_ID and by the student's school
        // (v7.20 O3: getStudentAttendance is now REC-filtered server-side;
        // the per-row check below is the second layer, so this function is
        // also correct on unfiltered input). A blank REC_ID matches any
        // school (old rows); a missing REC_ID on either side fails open.
        const attByStudent = {};
        (attRows || []).forEach(a => {
          const sid = norm(a.Std_ID);
          if (!studentById[sid]) return;
          const rowRec = norm(a.REC_ID);
          const stuRec = norm(studentById[sid].REC_ID);
          if (rowRec && stuRec && rowRec !== stuRec) return;
          const dt = parseAnyDate(a.Date);
          if (!dt) return;
          if (!attByStudent[sid]) attByStudent[sid] = [];
          attByStudent[sid].push({ status: String(a.Status || '').toLowerCase().trim(), hours: Number(a.Hours || 0), date: new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) });
        });

        // Working days: distinct Daily_Hours_Setup dates per class-section.
        const setupDaysBySection = {};
        (setupRows || []).forEach(h => {
          if (!h.Date || !h.Class_Section) return;
          const k = dayKey(h.Date);
          if (!k) return;
          const cs = String(h.Class_Section).trim();
          if (!setupDaysBySection[cs]) setupDaysBySection[cs] = {};
          setupDaysBySection[cs][k] = true;
        });
        // Fallback: distinct attendance dates per class-section.
        // v7.20 (O3): only dates from this roster's schools count — a
        // same-section date from another school must not create a
        // working day here. (No REC_ID anywhere fails open.)
        const rosterRecs = {};
        students.forEach(s => { const r = norm(s.REC_ID); if (r) rosterRecs[r] = true; });
        const attDaysBySection = {};
        (attRows || []).forEach(a => {
          const aRec = norm(a.REC_ID);
          if (aRec && Object.keys(rosterRecs).length && !rosterRecs[aRec]) return;
          const cs = String(a.Class_Section || ((a.Student_Class || '') + '-' + (a.Student_Section || ''))).trim();
          if (!cs) return;
          const dt = parseAnyDate(a.Date);
          if (!dt) return;
          const k = dayKey(dt);
          if (!attDaysBySection[cs]) attDaysBySection[cs] = {};
          attDaysBySection[cs][k] = true;
        });

        const endMonthEnd = monthEndDate(endKey);
        const out = [];
        students.forEach(st => {
          const cls = norm(st.Student_Class);
          const sec = norm(st.Student_Section);
          const cs = cls + '-' + sec;
          // Class-level span is the fallback; section-level range decides the window.
          const span = termSpanForClass_(data.class_terms || [], cls, selectedTerm);
          const range = termRangeForClass_(data.class_terms || [], cs, selectedTerm) || span;
          const doj = parseAnyDate(st.Date_of_Joining);
          const inactive = parseAnyDate(st.Inactive_Date);
          let winStart = range ? termParseDate_(range.start) : monthStartDate(months[0]);
          if (doj) {
            const dj = new Date(doj.getFullYear(), doj.getMonth(), doj.getDate());
            if (dj > winStart) winStart = dj;
          }
          let winEnd = new Date(endMonthEnd.getFullYear(), endMonthEnd.getMonth(), endMonthEnd.getDate());
          if (inactive) {
            const ia = new Date(inactive.getFullYear(), inactive.getMonth(), inactive.getDate());
            if (ia < winEnd) winEnd = ia;
          }
          // Cap at the student's own class-section term end (e.g. AUG classes end Jul 2027,
          // so a yearly run to Aug 2027 must not count a 13th month for them).
          if (range) {
            const re = termParseDate_(range.end);
            if (re && re < winEnd) winEnd = re;
          }
          const winStartKey = monthKeyOf(winStart.getFullYear(), winStart.getMonth() + 1);
          const winEndKey = monthKeyOf(winEnd.getFullYear(), winEnd.getMonth() + 1);
          const winMonths = monthsInRange(winStartKey, winEndKey).filter(k => months.indexOf(k) !== -1);
          if (!winMonths.length) return; // joined after the period, or left before it started
          const m = winMonths.length;
          const winStartStr = termDateKey_(winStart);
          const winEndStr = termDateKey_(winEnd);
          const recs = attByStudent[norm(st.Std_ID)] || [];
          const perMonth = months.map(mk => {
            if (winMonths.indexOf(mk) === -1) return { key: mk, attended: 0, working: 0, hours: 0 };
            const ms = monthStartDate(mk), me = monthEndDate(mk);
            const lo = ms > winStart ? ms : winStart;
            const hi = me < winEnd ? me : winEnd;
            const loStr = termDateKey_(lo), hiStr = termDateKey_(hi);
            let attended = 0, hours = 0;
            recs.forEach(r => {
              const k = termDateKey_(r.date);
              if (k < loStr || k > hiStr) return;
              // Only Present earns hours — matches MonthlyBarReport's Option A rule.
              if (r.status === 'present') { attended += 1; hours += (isNaN(r.hours) ? 0 : r.hours); }
            });
            hours = Math.round(hours * 100) / 100;
            let working = 0;
            const setupSet = setupDaysBySection[cs];
            if (setupSet) {
              working = Object.keys(setupSet).filter(k => k >= loStr && k <= hiStr).length;
            } else {
              const attSet = attDaysBySection[cs];
              working = attSet ? Object.keys(attSet).filter(k => k >= loStr && k <= hiStr).length : 0;
            }
            return { key: mk, attended, working, hours };
          });
          const attTotal = perMonth.reduce((s, x) => s + x.attended, 0);
          const workTotal = perMonth.reduce((s, x) => s + x.working, 0);
          const actualHours = Math.round(perMonth.reduce((s, x) => s + x.hours, 0) * 100) / 100;
          const requiredHours = Math.round(6.25 * m * 100) / 100;
          // Shortfall before the report month: required for enrolled months
          // before endKey minus hours earned in those months (0 if ahead).
          const prevMonths = winMonths.filter(k => k < endKey);
          const mPrev = prevMonths.length;
          const actualPrev = Math.round(perMonth.filter(x => x.key < endKey).reduce((s, x) => s + x.hours, 0) * 100) / 100;
          const shortfallPrev = Math.max(0, Math.round((6.25 * mPrev - actualPrev) * 100) / 100);
          const requiredThisMonth = Math.round((6.25 + shortfallPrev) * 100) / 100;
          // Total shortfall so far, and what the child must earn NEXT month
          // to be fully caught up (next month's own 6.25 plus the shortfall).
          const totalShortfall = Math.max(0, Math.round((requiredHours - actualHours) * 100) / 100);
          const requiredNextMonth = Math.round((6.25 + totalShortfall) * 100) / 100;
          const pct = workTotal > 0 ? Math.min(attTotal / workTotal, 1) : 0;
          let marking;
        
if (actualHours === 0) marking = 'P0';
else if (actualHours >= 6.25 * m) marking = 'P3';
else if (actualHours >= 2.5 * m) marking = 'P2';
else marking = 'P1';
const accessTag = marking === 'P3' ? 'NOT ACCESS' : 'ACCESS';
          const activeInMonth = isEnrolledInMonth(monthStartDate(endKey), monthEndDate(endKey), st.Date_of_Joining, st.Inactive_Date) ? 'Y' : 'N';
          const issueMonths = perMonth.filter(x => x.attended > 0 && x.hours < 1).map(x => monthLabelShort(x.key));
          // Trend: marking at the end of every month in the full window.
          // '—' when not enrolled that month (before joining / after leaving).
          const trend = months.map(mk => {
            if (winMonths.indexOf(mk) === -1) return { key: mk, marking: '—' };
            const mK = winMonths.filter(k => k <= mk).length;
            const actualK = Math.round(perMonth.filter(x => x.key <= mk).reduce((s, x) => s + x.hours, 0) * 100) / 100;
            let tm;
            if (actualK === 0) tm = 'P0';
            else if (actualK >= 6.25 * mK) tm = 'P3';
            else if (actualK >= 2.5 * mK) tm = 'P2';
            else tm = 'P1';
            return { key: mk, marking: tm };
          });
          out.push({
            sectionTag: sectionTagOf(cls),
            Class: cls,
            Section: sec,
            Std_ID: st.Std_ID,
            Student_Name: st.Student_Name,
            Date_of_Joining: st.Date_of_Joining || '',
            Gender: st.Gender || '',
            perMonth,
            attTotal, workTotal,
            pct: Math.round(pct * 1000) / 10,
            
            actualHours,
            requiredHours,
            shortfallPrev,
            requiredThisMonth,
            requiredNextMonth,
            marking,
            accessTag,
            active: activeInMonth,
            issues: issueMonths.length ? issueMonths.join(', ') : '—',
            trend,
            _enrolledMonths: m,
          });
        });
        out.sort((a, b) => {
          const ai = ACCESS_CLASS_ORDER.indexOf(a.Class), bi = ACCESS_CLASS_ORDER.indexOf(b.Class);
          const ao = ai === -1 ? 999 : ai, bo = bi === -1 ? 999 : bi;
          if (ao !== bo) return ao - bo;
          if (a.Section !== b.Section) return String(a.Section).localeCompare(String(b.Section));
          return String(a.Student_Name || '').localeCompare(String(b.Student_Name || ''));
        });
        // Show only the picked months as columns; totals and marking stay cumulative.
        if (displayMonths) out.forEach(r => { r.perMonth = r.perMonth.filter(x => displayMonths.indexOf(x.key) !== -1); });
        return out;
      };

      const generateReport = async (e) => {
        if (e) e.preventDefault();
        if (!selectedTerm) { setError('Please select a Term.'); return; }
        const endKey = periodEndKey();
        if (periodType === 'monthly' && !selectedMonths.length) { setError('Please select at least one Month.'); return; }
        const startKey = reportStartKey();
        if (!startKey) { setError('No term dates set up for Term ' + selectedTerm + '. Add Class_Terms rows first.'); return; }
        if (!endKey || endKey < startKey) { setError('The period ends before the term starts.'); return; }
        setIsLoading(true);
        setError('');
        try {
          const recId = userPermissions?.REC_ID || '';
          const startDate = startKey + '-01';
          const endDate = termDateKey_(monthEndDate(endKey));
          const [attRows, setupRows] = await Promise.all([
            callWithRetry('getStudentAttendance', { startDate, endDate, statusFilter: 'All', username }),
            callWithRetry('getSheetData', 'Daily_Hours_Setup', recId)
          ]);
          const months = monthsInRange(startKey, endKey);
          const displayMonths = periodType === 'monthly' ? selectedMonths.slice().sort() : months;
          const rows = buildReportRows(attRows || [], setupRows || [], months, endKey, displayMonths);
          setReportRows(rows);
          setReportMeta({ months: displayMonths, trendMonths: months, endKey, startKey, termId: selectedTerm });
          setGenerated(true);
          if (!rows.length) setError('No students enrolled in this period.');
        } catch (err) {
          setError('Failed to generate report: ' + err.message);
        }
        setIsLoading(false);
      };

      const downloadCSV = () => {
        if (!reportRows.length) { setError('No data to download'); return; }
        if (viewMode === 'trend') {
          if (trendMode === 'student') { downloadTrendStudentCSV(); return; }
          downloadTrendSummaryCSV(); return;
        }
        const months = reportMeta.months;
        const headers = ['Section Tag', 'Class', 'Sec', 'SIRN', 'Full Name', 'Date of Joining', 'Gender'];
        months.forEach(mk => { headers.push(monthLabelShort(mk) + ' Attended', monthLabelShort(mk) + ' Working', monthLabelShort(mk) + ' Hours'); });
        headers.push('Attended Days', 'Working Days', 'Attendance %','Actual Hours', 'Required Hours', 'Access Marking', 'ACCESS TAG', 'Active', 'Prev Shortfall', 'Required This Month', 'Required Next Month', 'Data Issues');
        let csv = headers.join(',') + '\n';
        reportRows.forEach(r => {
          const line = [r.sectionTag, r.Class, r.Section, r.Std_ID, r.Student_Name, r.Date_of_Joining, r.Gender];
          r.perMonth.forEach(x => { line.push(x.attended, x.working, x.hours); });
          line.push(r.attTotal, r.workTotal, r.pct + '%', r.actualHours, r.requiredHours, r.marking, r.accessTag, r.active, r.shortfallPrev, r.requiredThisMonth, r.requiredNextMonth, r.issues);
          csv += line.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'access_hours_report_' + (reportMeta.termId || '') + '_' + (reportMeta.endKey || '') + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setSuccessMessage('CSV downloaded!');
      };

      const downloadTrendStudentCSV = () => {
        const tMonths = (reportMeta && reportMeta.trendMonths) || [];
        const headers = ['Section Tag', 'Class', 'Sec', 'SIRN', 'Full Name', 'Gender', 'Active', 'Date of Joining'].concat(tMonths.map(monthLabelShort));
        let csv = headers.join(',') + '\n';
        filteredRows.forEach(r => {
          const line = [r.sectionTag, r.Class, r.Section, r.Std_ID, r.Student_Name, r.Gender, r.active, r.Date_of_Joining];
          tMonths.forEach(mk => {
            const t = (r.trend || []).find(x => x.key === mk);
            line.push(t ? t.marking : '—');
          });
          csv += line.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'access_hours_trend_' + (reportMeta.termId || '') + '_' + (reportMeta.endKey || '') + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setSuccessMessage('CSV downloaded!');
      };

      const downloadTrendSummaryCSV = () => {
        const headers = ['Class', 'Month', 'P0', 'P1', 'P2', 'P3', 'Total'];
        let csv = headers.join(',') + '\n';
        const pushBlock = (block) => {
          block.rows.forEach(rr => {
            const line = [block.heading, monthLabelShort(rr.month), rr.P0, rr.P1, rr.P2, rr.P3, rr.total];
            csv += line.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',') + '\n';
          });
        };
        trendSummary.classes.forEach(pushBlock);
        trendSummary.groups.forEach(pushBlock);
        pushBlock(trendSummary.grand);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'access_hours_trend_summary_' + (reportMeta.termId || '') + '_' + (reportMeta.endKey || '') + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setSuccessMessage('CSV downloaded!');
      };

      const clearForm = () => {
        setSelectedTerm('');
        setPeriodType('monthly');
        setSelectedMonths([]);
        setSelectedQuarter('Q1');
        setSelectedClass('');
        resetResults();
      };

      // Summary: per-class P0–P3 counts, group subtotals, Grand Total and %tage row.
      const summaryRows = (() => {
        const byClass = {};
        reportRows.forEach(r => {
          if (['P0', 'P1', 'P2', 'P3'].indexOf(r.marking) === -1) return;
          if (!byClass[r.Class]) byClass[r.Class] = { P0: 0, P1: 0, P2: 0, P3: 0 };
          byClass[r.Class][r.marking] += 1;
        });
        const classOrder = ACCESS_CLASS_ORDER.filter(c => byClass[c])
          .concat(Object.keys(byClass).filter(c => ACCESS_CLASS_ORDER.indexOf(c) === -1).sort());
        const rows = [];
        const addRow = (label, counts, isGroup, isPct) => {
          const total = counts.P0 + counts.P1 + counts.P2 + counts.P3;
          rows.push({
            label, P0: counts.P0, P1: counts.P1, P2: counts.P2, P3: counts.P3, total,
            p02: total ? Math.round(((counts.P0 + counts.P1 + counts.P2) / total) * 1000) / 10 : 0,
            p3: total ? Math.round((counts.P3 / total) * 1000) / 10 : 0,
            isGroup: !!isGroup, isPct: !!isPct
          });
        };
        SECTION_GROUPS.forEach(g => {
          const inGroup = classOrder.filter(c => g.classes.indexOf(c) !== -1);
          inGroup.forEach(c => addRow(c, byClass[c], false, false));
          if (inGroup.length) {
            const sum = { P0: 0, P1: 0, P2: 0, P3: 0 };
            inGroup.forEach(c => { sum.P0 += byClass[c].P0; sum.P1 += byClass[c].P1; sum.P2 += byClass[c].P2; sum.P3 += byClass[c].P3; });
            addRow(g.name, sum, true, false);
          }
        });
        const totals = { P0: 0, P1: 0, P2: 0, P3: 0 };
        classOrder.forEach(c => { totals.P0 += byClass[c].P0; totals.P1 += byClass[c].P1; totals.P2 += byClass[c].P2; totals.P3 += byClass[c].P3; });
        addRow('Grand Total', totals, true, false);
        const gt = totals.P0 + totals.P1 + totals.P2 + totals.P3;
        rows.push({
          label: '%tage',
          P0: gt ? Math.round((totals.P0 / gt) * 1000) / 10 : 0,
          P1: gt ? Math.round((totals.P1 / gt) * 1000) / 10 : 0,
          P2: gt ? Math.round((totals.P2 / gt) * 1000) / 10 : 0,
          P3: gt ? Math.round((totals.P3 / gt) * 1000) / 10 : 0,
          total: 100,
          p02: gt ? Math.round(((totals.P0 + totals.P1 + totals.P2) / gt) * 1000) / 10 : 0,
          p3: gt ? Math.round((totals.P3 / gt) * 1000) / 10 : 0,
          isGroup: true, isPct: true
        });
        return rows;
      })();

      // Class Summary trend: per-class P0–P3 counts at the end of every month.
      const trendSummary = (() => {
        const tMonths = (reportMeta && reportMeta.trendMonths) || [];
        const counts = {};
        reportRows.forEach(r => {
          (r.trend || []).forEach(t => {
            if (t.marking === '—') return;
            if (!counts[r.Class]) counts[r.Class] = {};
            if (!counts[r.Class][t.key]) counts[r.Class][t.key] = { P0: 0, P1: 0, P2: 0, P3: 0 };
            counts[r.Class][t.key][t.marking] += 1;
          });
        });
        const classOrder = ACCESS_CLASS_ORDER.filter(c => counts[c])
          .concat(Object.keys(counts).filter(c => ACCESS_CLASS_ORDER.indexOf(c) === -1).sort());
        const monthRows = (get) => tMonths.map(mk => {
          const c = get(mk) || { P0: 0, P1: 0, P2: 0, P3: 0 };
          return { month: mk, P0: c.P0, P1: c.P1, P2: c.P2, P3: c.P3, total: c.P0 + c.P1 + c.P2 + c.P3 };
        });
        const classes = classOrder.map(c => ({ heading: 'Class ' + c, rows: monthRows(mk => counts[c][mk]) }));
        const groups = [];
        SECTION_GROUPS.forEach(g => {
          const inGroup = classOrder.filter(c => g.classes.indexOf(c) !== -1);
          if (!inGroup.length) return;
          groups.push({ heading: g.name, rows: monthRows(mk => {
            const sum = { P0: 0, P1: 0, P2: 0, P3: 0 };
            inGroup.forEach(c => { const cc = counts[c][mk]; if (cc) { sum.P0 += cc.P0; sum.P1 += cc.P1; sum.P2 += cc.P2; sum.P3 += cc.P3; } });
            return sum;
          }) });
        });
        const grand = { heading: 'Grand Total', rows: monthRows(mk => {
          const sum = { P0: 0, P1: 0, P2: 0, P3: 0 };
          classOrder.forEach(c => { const cc = counts[c][mk]; if (cc) { sum.P0 += cc.P0; sum.P1 += cc.P1; sum.P2 += cc.P2; sum.P3 += cc.P3; } });
          return sum;
        }) };
        return { classes, groups, grand };
      })();

      const filteredRows = searchQuery
        ? reportRows.filter(item => Object.values(item).some(val => {
            if (val && typeof val === 'object') return false;
            return String(val ?? '').toLowerCase().includes(searchQuery.toLowerCase());
          }))
        : reportRows;
      const markingClass = (mk) => mk === 'P3' ? 'text-green-600 bg-green-50 dark:bg-green-900/30'
        : mk === 'P2' ? 'text-blue-600 bg-blue-50 dark:bg-blue-900/30'
        : mk === 'P1' ? 'text-orange-600 bg-orange-50 dark:bg-orange-900/30'
        : mk === 'P0' ? 'text-red-600 bg-red-50 dark:bg-red-900/30'
        : 'text-gray-500 bg-gray-100 dark:bg-gray-800';
      const thFixed = 'border border-gray-300 dark:border-gray-600 p-2 bg-gray-100 dark:bg-gray-700';
      const thMonth = 'border border-gray-300 dark:border-gray-600 p-2 text-center bg-blue-100 dark:bg-blue-900';

      const renderTrendSummaryBlock = (block, key) => (

      return (
        <div className="card p-6">

    // ---------- Daily Hours Report (v6.6) ----------
    // Term-wise setup hours by class/section, type and category, from
    // Daily_Hours_Setup. All maths runs server-side in
    // generateDailyHoursReport (dedupes identical setup rows, links episodic
    // rows to Episodic_Events, checks each setup day against
    // Student_Attendance). Admins only — no teacher scoping, all classes
    // visible, like the portal's other reports.
    function DailyHoursReport({ data, isLoading, setIsLoading, setError, setSuccessMessage, userPermissions, classes, classSectionMap, searchQuery, username }) {
      const [selectedTerm, setSelectedTerm] = useState('');
      const [selectedClass, setSelectedClass] = useState('');
      const [selectedSection, setSelectedSection] = useState('');
      const [periodType, setPeriodType] = useState('full');
      const [selectedMonth, setSelectedMonth] = useState('');
      const [selectedYear, setSelectedYear] = useState('');
      const [selectedQuarter, setSelectedQuarter] = useState('Q1');
      const [report, setReport] = useState(null);
      const [generated, setGenerated] = useState(false);

      const fmtH = (v) => { const n = Number(v); return Number.isFinite(n) ? (Math.round(n * 100) / 100) : v; };
      const termOptions = termPickerOptions_(data.terms || []).filter(t => termIsActive_(t.Is_Active));

      // Term is mandatory (v6.7): no auto-default — the picker starts empty
      // and Generate refuses until a term is picked.
      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      // Quarter ends reuse the ACCESS report's definition exactly.
      const DHR_QUARTERS = { Q1: { month: 11, yearOff: 0 }, Q2: { month: 2, yearOff: 1 }, Q3: { month: 5, yearOff: 1 }, Q4: { month: 8, yearOff: 1 } };
      // Classes actually in the picked term (Class_Terms rows), falling back
      // to every class when no term is picked yet.
      const termClassList = selectedTerm ? termClasses_(data.class_terms || [], selectedTerm) : null;
      const visibleClasses = (classes || []).filter(c => !termClassList || termClassList.indexOf(c) !== -1);
      const classOptions = visibleClasses.length ? visibleClasses : (termClassList || []);
      const sectionOptions = selectedClass ? ((classSectionMap || {})[selectedClass] || []) : [];
      const termSpan = selectedTerm ? termSpan_(data.class_terms || [], selectedTerm) : null;
      const termYears = (() => {
        if (!termSpan) return [];
        const sY = parseInt(String(termSpan.start).slice(0, 4), 10);
        const eY = parseInt(String(termSpan.end).slice(0, 4), 10);
        if (!sY || !eY) return [];
        const out = [];
        for (let y = sY; y <= eY; y++) out.push(y);
        return out;
      })();
      const termStartYear = () => {
        const found = String(selectedTerm || '').match(/(\d{4})/);
        if (found) return parseInt(found[1], 10);
        return termYears.length ? termYears[0] : new Date().getFullYear();
      };
      const quarterOptions = ['Q1', 'Q2', 'Q3', 'Q4'].map(q => {
        const def = DHR_QUARTERS[q];
        const endY = termStartYear() + def.yearOff;
        return { value: q, label: q + ' — ends ' + MONTH_NAMES[def.month - 1] + ' ' + endY };
      });
      const periodValue = () => {
        if (periodType === 'month') return (selectedYear && selectedMonth) ? selectedYear + '-' + selectedMonth : '';
        if (periodType === 'qtd') return selectedQuarter;
        return '';
      };
      const filterLabel = () => {
        const parts = [];
        if (selectedClass) parts.push(selectedSection ? selectedClass + '-' + selectedSection : selectedClass);
        if (periodType === 'month' && selectedYear && selectedMonth) parts.push(MONTH_NAMES[parseInt(selectedMonth, 10) - 1] + ' ' + selectedYear);
        if (periodType === 'qtd') parts.push(selectedQuarter + ' (QTD)');
        return parts.length ? ' · ' + parts.join(' · ') : '';
      };
      const filterSuffix = () => {
        let s = '';
        if (selectedClass) s += '_' + selectedClass + (selectedSection ? '-' + selectedSection : '');
        if (periodType === 'month' && selectedYear && selectedMonth) s += '_' + selectedYear + '-' + selectedMonth;
        if (periodType === 'qtd') s += '_' + selectedQuarter;
        return s;
      };

      const resetResults = () => { setReport(null); setGenerated(false); };
      const clearForm = () => { setSelectedTerm(''); setSelectedClass(''); setSelectedSection(''); setPeriodType('full'); setSelectedMonth(''); setSelectedYear(''); setSelectedQuarter('Q1'); resetResults(); };

      const generateReport = async (e) => {
        if (e) e.preventDefault();
        if (!selectedTerm) { setError('Please select a Term.'); return; }
        if (periodType === 'month' && (!selectedMonth || !selectedYear)) { setError('Please select a Month and Year.'); return; }
        setIsLoading(true);
        setError('');
        try {
          // Same recId source as the ACCESS report: the current user's REC_ID.
          const recId = userPermissions?.REC_ID || '';
          const result = await callWithRetry('generateDailyHoursReport', selectedTerm, recId, selectedClass, selectedSection, periodType, periodValue());
          setReport(result || null);
          setGenerated(true);
          if (!result || !(result.detail || []).length) {
            setError('No Daily Hours setup rows found in Term ' + selectedTerm + filterLabel() + '.');
          }
        } catch (err) {
          setError('Failed to generate report: ' + err.message);
        }
        setIsLoading(false);
      };

      // CSV download — same Blob pattern as the ACCESS report's downloadCSV.
      const downloadCSVFile = (rows, filename) => {
        if (!rows || !rows.length) { setError('No data to download'); return; }
        const headers = Object.keys(rows[0]);
        let csv = headers.join(',') + '\n';
        rows.forEach(row => {
          csv += headers.map(h => '"' + String(row[h] ?? '').replace(/"/g, '""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setSuccessMessage('CSV downloaded!');
      };

      const downloadDetailCSV = () => {
        if (!report) { setError('No data to download'); return; }
        downloadCSVFile(report.detail, 'daily_hours_detail_' + (report.termId || selectedTerm) + filterSuffix() + '.csv');
      };
      const downloadOrphanCSV = () => {
        if (!report) { setError('No data to download'); return; }
        downloadCSVFile(report.orphanEvents, 'daily_hours_orphan_events_' + (report.termId || selectedTerm) + filterSuffix() + '.csv');
      };
      // Summary CSV: the three summary tables + orphan events as labelled
      // sections in one file, so every on-screen summary table is covered.
      const downloadSummaryCSV = () => {
        if (!report) { setError('No data to download'); return; }
        const lines = [];
        const block = (title, rows) => {
          if (!rows || !rows.length) return;
          lines.push(title);
          const headers = Object.keys(rows[0]);
          lines.push(headers.join(','));
          rows.forEach(row => {
            lines.push(headers.map(h => '"' + String(row[h] ?? '').replace(/"/g, '""') + '"').join(','));
          });
          lines.push('');
        };
        block('Per class-section', report.classSummary);
        block('Per group', report.groupSummary);
        block('Hours by category', report.categorySummary);
        block('Episodic events without a setup row', report.orphanEvents);
        if (!lines.length) { setError('No data to download'); return; }
        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'daily_hours_summary_' + (report.termId || selectedTerm) + filterSuffix() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setSuccessMessage('CSV downloaded!');
      };

      // PNG download. NOTE: the portal's renderAsPNG lives inside
      // AttendanceReportsPage, so it is not in scope for this component —
      // this is the same pattern in local form (off-screen table +
      // html2canvas, scale 3, same title block and caveat footer).
      const capturePNG = async (innerHtml, filename, title, subtitle) => {
        setIsLoading(true);
        const reportDiv = document.createElement('div');
        reportDiv.setAttribute('data-theme', 'light');

    function AttendanceReportsPage({ data, isLoading, setIsLoading, setError, setSuccessMessage }) {
  const [dailyDate, setDailyDate] = useState('');
  const [dailyClass, setDailyClass] = useState('');
  const [dailySection, setDailySection] = useState('');
  const [dailyFormat, setDailyFormat] = useState('png');
  const [reportTerm, setReportTerm] = useState('');

  const [reportType, setReportType] = useState('single');
  const [monthlyClass, setMonthlyClass] = useState('');
  const [monthlySection, setMonthlySection] = useState('');
  const [monthlyStudentId, setMonthlyStudentId] = useState('');
  const [monthlyMonth, setMonthlyMonth] = useState('');
  const [monthlyFormat, setMonthlyFormat] = useState('png');
  const [downloadHistory, setDownloadHistory] = useState([]);

  const classesList = [...new Set(data.student_data.map(s => s.Student_Class).filter(Boolean))].filter(cls => !reportTerm || termClasses_(data.class_terms || [], reportTerm).includes(cls));
  // Term ranges for the picked daily / monthly class-section (per-class range, not one global range).
  const dailyTermRange = (reportTerm && dailyClass && dailySection) ? termRangeForClass_(data.class_terms || [], dailyClass + '-' + dailySection, reportTerm) : null;
  const monthlyTermRange = (reportTerm && monthlyClass && monthlySection) ? termRangeForClass_(data.class_terms || [], monthlyClass + '-' + monthlySection, reportTerm) : null;
  const sectionsByClass = {};
  classesList.forEach(cls => {
    sectionsByClass[cls] = [...new Set(data.student_data.filter(s => s.Student_Class === cls).map(s => s.Student_Section).filter(Boolean))];
  });

  // Handles both "dd-MMM-yyyy" strings (Portal's own format) and native Date/ISO strings
  const parseAnyDate = (d) => {
    if (!d) return null;
    if (typeof d === 'string' && /^\d{2}-[A-Za-z]{3}-\d{4}$/.test(d)) {
      const [day, monStr, year] = d.split('-');
      const monthMap = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
      return new Date(parseInt(year), monthMap[monStr], parseInt(day));
    }
    const dt = new Date(d);
    return isNaN(dt) ? null : dt;
  };

  const toYMD = (d) => {
    const dt = parseAnyDate(d);
    if (!dt) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  };

  const monthlyStudents = monthlyClass && monthlySection
    ? data.student_data.filter(s => s.Student_Class === monthlyClass && s.Student_Section === monthlySection)
    : [];

  const availableMonths = (() => {
    const source = reportType === 'single' && monthlyStudentId
      ? data.student_attendance.filter(a => String(a.Std_ID) === String(monthlyStudentId))
      : (monthlyClass && monthlySection ? data.student_attendance.filter(a => a.Student_Class === monthlyClass && a.Student_Section === monthlySection) : []);
    const set = new Set();
    source.forEach(a => {
      const dt = parseAnyDate(a.Date);
      if (dt) set.add(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`);
    });
    const months = Array.from(set).sort((a, b) => b.localeCompare(a)).map(key => {
      const [y, m] = key.split('-').map(Number);
      return { key, display: `${new Date(y, m - 1).toLocaleString('default', { month: 'long' })} ${y}` };
    });
    // Term filter (v4): only months overlapping this class-section's term range.
    if (monthlyTermRange) {
      return months.filter(mo => {
        const [y, m] = mo.key.split('-').map(Number);
        const ms = new Date(y, m - 1, 1);
        const me = new Date(y, m, 0);
        return ms <= termParseDate_(monthlyTermRange.end) && me >= termParseDate_(monthlyTermRange.start);
      });
    }
    return months;
  })();

  const computeSummary = (stdId, month, year) => {
    let presents = 0, absents = 0, leaves = 0, totalDays = 0;
    data.student_attendance.forEach(r => {
      if (String(r.Std_ID) !== String(stdId)) return;
      const dt = parseAnyDate(r.Date);
      if (!dt || dt.getFullYear() !== year || (dt.getMonth() + 1) !== month) return;
      totalDays++;
      const st = (r.Status || '').toLowerCase();
      if (st === 'present') presents++;
      else if (st === 'absent') absents++;
      else if (st === 'leave') leaves++;
    });
    return { presents, absents, leaves, totalDays, presentPercentage: totalDays > 0 ? Math.round((presents / totalDays) * 10000) / 100 : 0 };
  };

  const downloadCSVReport = (rows, filename) => {
    const headers = Object.keys(rows[0]);
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
      csv += headers.map(h => `"${(row[h] ?? '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
  };

  const getStatusStyle = (status) => {
    switch ((status || '').toLowerCase()) {

  const getPercentColor = (pct) => (pct >= 75 ? '#2e7d32' : pct >= 50 ? '#ef6c00' : '#c62828');
  const getPercentBg = (pct) => (pct >= 75 ? '#e8f5e9' : pct >= 50 ? '#fff3e0' : '#ffebee');

  const renderAsPNG = async (rows, filename, title, subtitle) => {
