                        <button
                          onClick={() => {
                            if (table === 'student_data' && !canDeleteStudent) {
                              setError('You do not have permission to delete student records');
                              return;
                            }
                            handleDeleteClick(table, index, item._rowNumber);
                          }}
                          className={`text-red-500 hover:underline ${table === 'student_data' && !canDeleteStudent ? 'opacity-50 cursor-not-allowed' : ''}`}
                          disabled={table === 'student_data' && !canDeleteStudent}
                        >
                          Delete
                        </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {deactivateRow && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="card p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-semibold mb-2">Deactivate {deactivateRow.Student_Name} (Std_ID {deactivateRow.Std_ID})</h3>
                <p className="text-sm text-gray-600 dark:text-gray-400 mb-4">The student will become Inactive. A reason is required — a Transfer creates a Transfer Certificate; an Error records the correction instead. Once a certificate record is issued — Transfer or Error — the student record is locked — it can no longer be edited, deleted or reactivated from the portal.</p>
                <form onSubmit={handleDeactivateSubmit}>
                  <div className="form-section">
                    <div className="form-section-title">
                      <i className="uil uil-user"></i>
                      Identity (prints on the certificate)
                    </div>
                    <div className="form-row">
                      <div className="form-field">
                        <label htmlFor="deactDob">Date of Birth{String(deactivateRow.Date_of_Birth || '').trim() ? ' (from student record)' : ''}</label>
                        <input type="date" name="Date_of_Birth" value={formData.Date_of_Birth || ''} onChange={handleInputChange} className="form-input" id="deactDob" disabled={!!String(deactivateRow.Date_of_Birth || '').trim()} />
                        {formErrors.Date_of_Birth && (<p className="form-error">{formErrors.Date_of_Birth}</p>)}
                        {String(deactivateRow.Date_of_Birth || '').trim() ? (<p className="text-sm text-gray-600 dark:text-gray-400">Taken from the student record — add or correct it on the student form first if it is wrong.</p>) : (<p className="text-sm text-gray-600 dark:text-gray-400">The record has no Date of Birth — enter it here; it will be saved to the student record.</p>)}
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-field">
                        <label htmlFor="deactAddress">Current Address</label>
                        <input type="text" name="Address" value={formData.Address || ''} onChange={handleInputChange} placeholder="Address" className="form-input" id="deactAddress" />
                        {formErrors.Address && (<p className="form-error">{formErrors.Address}</p>)}
                      </div>
                    </div>
                  </div>
                  {renderTcSection()}
                  {formErrors.general && (<p className="form-error">{formErrors.general}</p>)}
                  {tcPreviewState === 'loading' && (<p className="text-sm text-gray-600 dark:text-gray-400 mb-3">Loading attendance…</p>)}
                  {tcPreviewState === 'failed' && (<p className="text-sm text-gray-600 dark:text-gray-400 mb-3">Attendance preview could not be loaded.</p>)}
                  {tcPreviewState === 'ready' && tcPreview && (
                    <div className="mb-4">
                      <h4 className="text-base font-semibold mb-2">Attendance that will print on the certificate</h4>
                      <p className="text-sm text-gray-600 dark:text-gray-400 mb-2">Last Day of attendance: <b>{tcPreview.lastDayOfAttendance ? tcShortDate_(tcPreview.lastDayOfAttendance) : '—'}</b></p>
                      <div className="overflow-x-auto">
                        <table className="w-full border-collapse text-sm">
                          <thead>
                            <tr>
                              <th className="border border-gray-300 dark:border-gray-600 p-2 text-left"></th>
                              {tcTermGroups_(tcPreview.attendance).map((run, i) => (
                                <th key={'term-' + i} colSpan={run.count} className="border border-gray-300 dark:border-gray-600 p-2 text-center font-bold">{run.label}</th>
                              ))}
                              <th className="border border-gray-300 dark:border-gray-600 p-2 text-center font-semibold"></th>
                            </tr>
                            <tr>
                              <th className="border border-gray-300 dark:border-gray-600 p-2 text-left">Month</th>
                              {tcPreview.attendance.map(m => (
                                <th key={m.monthKey} className="border border-gray-300 dark:border-gray-600 p-2 text-center font-semibold">{m.month}</th>
                              ))}
                              <th className="border border-gray-300 dark:border-gray-600 p-2 text-center font-semibold">Total</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td className="border border-gray-300 dark:border-gray-600 p-2 font-semibold">Working Days</td>
                              {tcPreview.attendance.map(m => (<td key={m.monthKey} className="border border-gray-300 dark:border-gray-600 p-2 text-center">{m.workingDays ? m.workingDays : ''}</td>))}
                              <td className="border border-gray-300 dark:border-gray-600 p-2 text-center font-bold">{tcPreview.totalWorking}</td>
                            </tr>
                            <tr>
                              <td className="border border-gray-300 dark:border-gray-600 p-2 font-semibold">Days of Present</td>
                              {tcPreview.attendance.map(m => (<td key={m.monthKey} className="border border-gray-300 dark:border-gray-600 p-2 text-center">{m.daysPresent ? m.daysPresent : ''}</td>))}
                              <td className="border border-gray-300 dark:border-gray-600 p-2 text-center font-bold">{tcPreview.totalPresent}</td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                  <div className="form-actions">
                    <button type="submit" disabled={isLoading} className={`btn-primary ${isLoading ? 'opacity-75 cursor-not-allowed' : ''}`}>{isLoading ? 'Saving...' : 'Deactivate student'}</button>
                    <button type="button" onClick={() => { setDeactivateRow(null); setTcData({}); setFormData({}); setFormErrors({}); }} className="btn-outline">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {reactivateRow && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="card p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-semibold mb-4">Reactivate student?</h3>
                <p className="text-gray-600 dark:text-gray-400 mb-4">Reactivate {reactivateRow.Student_Name} (Std_ID {reactivateRow.Std_ID})? The Inactive reason and date will be cleared. The old Transfer Certificate / error record stays as history.</p>
                <div className="flex flex-col-reverse sm:flex-row gap-3">
                  <button onClick={handleReactivateConfirm} disabled={isLoading} className="btn-primary w-full sm:w-auto justify-center">{isLoading ? 'Saving...' : 'Yes, Reactivate'}</button>
                  <button onClick={() => setReactivateRow(null)} className="btn-outline w-full sm:w-auto">Cancel</button>
                </div>
              </div>
            </div>
          )}
          {showDeleteConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="card p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-semibold mb-4">Confirm Delete</h3>
                <p className="text-gray-600 dark:text-gray-400 mb-4">Are you sure you want to delete this record?</p>
                <div className="flex flex-col-reverse sm:flex-row gap-3">
                  <button
                    onClick={confirmDelete}
                    className="btn-primary w-full sm:w-auto justify-center"
                  >
                    Yes, Delete
                  </button>
                  <button
                    onClick={() => setShowDeleteConfirm(false)}
                    className="btn-outline w-full sm:w-auto"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
